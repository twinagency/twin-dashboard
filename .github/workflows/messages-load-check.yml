name: Messages load verification
on:
  push:
    branches: [codex/messages-load-speed-20261022]
  workflow_run:
    workflows: [deploy-dashboard]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  messages:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Read actual selected and all-creator Messages pages without writes
        run: python3 deployment/messages-load-check.py
        env:
          EXPECTED_DASHBOARD_SHA: ${{ github.event.workflow_run.head_sha || 'cd0815ce12ac489229d1929da89e948672166585' }}
