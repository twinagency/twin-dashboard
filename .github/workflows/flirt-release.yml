name: FLIRT isolated release
on:
  push:
    branches: ["flirt/independent-backend-2026-09-19"]
    paths:
      - .github/workflows/flirt-release.yml
      - deployment/flirt-release.py
      - deployment/flirt-host-release.py
      - deployment/flirt-host-release.test.py
      - deployment/flirt-release-request.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flirt-release-dashboard
  cancel-in-progress: false
env:
  AWS_REGION: ap-southeast-2
  ECR_REPO: 323149985112.dkr.ecr.ap-southeast-2.amazonaws.com/twin-dashboard
jobs:
  verify:
    if: github.ref == 'refs/heads/flirt/independent-backend-2026-09-19'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: FLIRT database, provider and release boundaries
        run: |
          npm run test:flirt-isolation
          python3 deployment/flirt-host-release.test.py
          python3 -m py_compile deployment/flirt-host-release.py deployment/flirt-release.py
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Existing application checks
        run: |
          npm run test:offline
          npm run test:creator-routing
          npm run test:creator-login
          npm run test:creator-onboarding
  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Existing authorised AWS deployment connection
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify the existing AWS account
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = '323149985112'
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and publish an immutable FLIRT image
        id: image
        run: |
          set -euo pipefail
          docker build --build-arg GIT_SHA="$GITHUB_SHA" -t "$ECR_REPO:flirt-$GITHUB_SHA" .
          docker push "$ECR_REPO:flirt-$GITHUB_SHA"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$ECR_REPO:flirt-$GITHUB_SHA")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Install protected FLIRT settings and start its separate container
        env:
          FLIRT_SUPABASE_SERVICE_KEY: ${{ secrets.FLIRT_SUPABASE_SERVICE_KEY }}
          FLIRT_IMAGE: ${{ steps.image.outputs.digest }}
        run: python3 deployment/flirt-release.py dashboard "$FLIRT_IMAGE" "$GITHUB_SHA"
