name: FLIRT isolated release
on:
  push:
    branches: ["flirt/independent-backend-2026-09-19"]
    paths:
      - .github/workflows/flirt-release.yml
      - deployment/flirt-release.py
      - deployment/flirt-host-release.py
      - deployment/flirt-host-release.test.py
      - deployment/flirt-release-request.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flirt-release-dashboard
  cancel-in-progress: false
env:
  AWS_REGION: ap-southeast-2
  ECR_REPO: 323149985112.dkr.ecr.ap-southeast-2.amazonaws.com/twin-dashboard
jobs:
  verify:
    if: github.ref == 'refs/heads/flirt/independent-backend-2026-09-19'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: FLIRT database, provider and release boundaries
        run: |
          npm run test:flirt-isolation
          node --test deployment/flirt-live-twin.test.cjs
          python3 deployment/flirt-host-release.test.py
          python3 -m py_compile deployment/flirt-host-release.py deployment/flirt-release.py deployment/creator-flow-live-check.py
          node --check deployment/creator-flow-live-check.cjs
          node --check deployment/flirt-live-creators-check.cjs
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Owner authentication and existing master access
        run: node --import tsx scripts/check-owner-auth.ts
      - name: Creator flow and recoverable form regressions
        run: npm run test:creator-flow
      - name: Streaming creator video upload regressions
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          node scripts/check-creator-video-upload.cjs
          node --import tsx scripts/check-creator-upload-stream.ts
          node scripts/check-creator-upload-picker.cjs
          node deployment/creator-flow-live-check.test.cjs
          node deployment/creator-flow-upload-memory.test.cjs
          node deployment/creator-flow-cleanup.test.cjs
      - name: Selected live creators and retained local database routing
        run: npx tsx scripts/check-flirt-live-twin.ts
      - name: Invitation routing and local account authorization
        run: npx tsx scripts/check-flirt-invites.ts
      - name: Creator upload review and safe bot selection
        run: |
          node --import tsx scripts/check-flirt-account-linking.ts
          node --import tsx scripts/check-creator-account-files.ts
          node --import tsx scripts/check-creator-upload-gallery.tsx
      - name: Empty onboarding and retained authentication boundaries
        run: |
          npx tsx scripts/check-flirt-optional-onboarding.tsx
          npx tsx scripts/check-flirt-return-onboarding.ts
      - name: Existing application checks
        run: |
          npm run test:offline
          npm run test:creator-routing
          npm run test:creator-login
          npm run test:creator-onboarding
  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Existing authorised AWS deployment connection
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify the existing AWS account
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = '323149985112'
      - name: Require the new dashboard DNS and HTTPS before changing its origin
        run: |
          set -euo pipefail
          curl --retry 3 --retry-delay 5 --connect-timeout 10 --max-time 30 -fsS https://dashboard.flirtaiagency.com/creator/login -o /tmp/flirt-domain-login.html
          grep -q FLIRT /tmp/flirt-domain-login.html
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and publish an immutable FLIRT image
        id: image
        run: |
          set -euo pipefail
          docker build --build-arg GIT_SHA="$GITHUB_SHA" -t "$ECR_REPO:flirt-$GITHUB_SHA" .
          docker push "$ECR_REPO:flirt-$GITHUB_SHA"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$ECR_REPO:flirt-$GITHUB_SHA")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Wait for creator uploads before restart
        run: python3 deployment/creator-upload-idle.py --brand=flirt

      - name: Install protected FLIRT settings and start its separate container
        env:
          FLIRT_SUPABASE_SERVICE_KEY: ${{ secrets.FLIRT_SUPABASE_SERVICE_KEY }}
          FLIRT_IMAGE: ${{ steps.image.outputs.digest }}
        run: python3 deployment/flirt-release.py dashboard "$FLIRT_IMAGE" "$GITHUB_SHA"
      - name: Verify normal FLIRT signup, optional flow and 75 MiB photo boundaries with exact cleanup
        timeout-minutes: 15
        run: python3 deployment/creator-flow-live-check.py --brand=flirt --expected-sha="$GITHUB_SHA" --mode=photo-boundaries --removal-guards
      - name: Verify all four live creators, existing media and denied unassigned access
        run: python3 deployment/flirt-live-creators-check.py

