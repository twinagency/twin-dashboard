name: FLIRT deployment capacity check
on:
  push:
    branches: ["codex/flirt-agency-overview-20261011"]
    paths: [".github/workflows/flirt-capacity-check.yml", "deployment/flirt-capacity-check.py"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Inspect capacity without altering services, containers, images or volumes
        run: python3 deployment/flirt-capacity-check.py
