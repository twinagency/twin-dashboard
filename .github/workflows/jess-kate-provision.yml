name: Jess Kate login provisioning
on:
  push:
    branches: [ops/jess-kate-login-setup]
    paths: [.github/workflows/jess-kate-provision.yml]
permissions:
  contents: read
  actions: read
jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require successful portal deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,time
          request=urllib.request.Request('https://api.github.com/repos/ronan-com/twin-dashboard/actions/runs/34311559112',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          for _ in range(45):
            with urllib.request.urlopen(request) as r: data=json.load(r)
            assert data['head_sha']=='e6287780dc16588ded2e7e4a3f17f0539015300d'
            if data['status']=='completed':
              assert data['conclusion']=='success','Portal deployment failed'
              break
            time.sleep(10)
          else: raise RuntimeError('Portal deployment not ready')
          print('Verified portal deployment succeeded')
          PY
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Provision fixed tenant and verify live login
        run: |
          python3 - <<'PY'
          import base64,json,pathlib,subprocess,time
          code=base64.b64encode(pathlib.Path('scripts/provision-jess-kate-once.cjs').read_bytes()).decode()
          command="printf '%s' '"+code+"' | base64 -d | sudo docker exec -i -w /app next-app node - e6287780dc16588ded2e7e4a3f17f0539015300d"
          pathlib.Path('/tmp/jess-kate-params.json').write_text(json.dumps({'commands':[command],'executionTimeout':['600']}))
          args=['aws','ssm','send-command','--instance-ids','i-09a9dd3bd749643a5','--document-name','AWS-RunShellScript','--comment','Owner-authorized Jess and Kate AI login creation and scoped read-only verification','--parameters','file:///tmp/jess-kate-params.json','--output','json']
          result=json.loads(subprocess.check_output(args));cid=result['Command']['CommandId']
          print('Provision command:',cid,flush=True)
          for _ in range(125):
            time.sleep(5)
            p=subprocess.run(['aws','ssm','get-command-invocation','--command-id',cid,'--instance-id','i-09a9dd3bd749643a5','--output','json'],capture_output=True,text=True)
            if p.returncode: continue
            invocation=json.loads(p.stdout)
            if invocation['Status'] not in ('Pending','InProgress','Delayed'):
              print(invocation.get('StandardOutputContent',''))
              print(invocation.get('StandardErrorContent',''))
              assert invocation['Status']=='Success','Provisioning or live check did not complete'
              assert 'JESS_KATE_VERIFIED=' in invocation.get('StandardOutputContent','')
              break
          else: raise RuntimeError('Provision command timed out; inspect before retrying')
          PY
