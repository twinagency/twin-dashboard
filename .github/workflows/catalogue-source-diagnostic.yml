name: Read-only existing catalogue source diagnostic
on:
  push:
    branches: [codex/moxy-existing-video-diagnostic-20261015]
    paths:
      - .github/workflows/catalogue-source-diagnostic.yml
      - deployment/catalogue-source-diagnostic.*
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Read only the four previously failing source objects
        run: python3 deployment/catalogue-source-diagnostic.py
