name: FLIRT overview photo review
on:
  push:
    branches: ["codex/flirt-callace-overview-20261011"]
    paths: [".github/workflows/flirt-overview-review.yml", "deployment/flirt-overview-review.py"]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Read the selected creator's existing photos for the approved dashboard
        run: python3 deployment/flirt-overview-review.py
      - uses: actions/upload-artifact@v4
        with:
          name: flirt-overview-photo-review
          path: /tmp/flirt-overview-review
          retention-days: 1
