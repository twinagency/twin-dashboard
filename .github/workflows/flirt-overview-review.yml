name: FLIRT overview photo review
on:
  push:
    branches: ["codex/flirt-callace-overview-20261011"]
    paths: [".github/workflows/flirt-overview-review.yml", "deployment/flirt-overview-review.py", "deployment/flirt-overview-ui-check.cjs", "components/overview/**"]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Read the selected creator's existing photos for the approved dashboard
        run: python3 deployment/flirt-overview-review.py
      - name: Include exact source for the approved local build
        run: git archive --format=tar.gz HEAD > /tmp/flirt-overview-review/source.tar.gz
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx playwright install --with-deps chromium
      - name: Check creator isolation, filters, unique photos and responsive layout
        run: node deployment/flirt-overview-ui-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flirt-overview-photo-review
          path: /tmp/flirt-overview-review
          retention-days: 1
