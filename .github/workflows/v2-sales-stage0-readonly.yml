name: Twin V2 Stage 0 read-only sales compatibility
on:
  push:
    branches: [codex/v2-sales-stage0-audit-20261014]
    paths:
      - .github/workflows/v2-sales-stage0-readonly.yml
      - deployment/v2-sales-stage0-readonly.*
permissions:
  contents: read
concurrency:
  group: twin-v2-production-operations
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Read running revision, feature flags and eligible inventory
        run: python3 deployment/v2-sales-stage0-readonly.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twin-v2-sales-stage0
          path: stage0-evidence/live-snapshot.json
          if-no-files-found: warn
          retention-days: 7
