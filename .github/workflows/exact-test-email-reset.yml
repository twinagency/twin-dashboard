name: Clear two explicitly authorized old login identities
on:
  push:
    branches: ['ops/flirt-exact-test-reset-20261005']
permissions:
  contents: read
concurrency:
  group: flirt-release-dashboard
  cancel-in-progress: false
jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deletion guards without production access
        run: node deployment/clear-flirt-test-20261005.test.cjs
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Clear only the authorized old test identity
        run: python3 deployment/clear-flirt-test-20261005.py
