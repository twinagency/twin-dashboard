name: Reset recent creator test accounts

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RESET-RECENT-CREATOR-TEST-ACCOUNTS"
        required: true
        type: string
      deployed_sha:
        description: "Full 40-character SHA currently deployed to the dashboard"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Share the production deploy lock. The live container cannot be replaced
  # between the SHA check and this destructive operation.
  group: deploy-dashboard
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  INSTANCE_ID: i-09a9dd3bd749643a5
  CONTAINER: next-app

jobs:
  reset:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Prove the reset guardrails without network access
        run: node scripts/check-reset-recent-creator-test-accounts.mjs

      - name: Validate destructive-operation inputs
        id: inputs
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          DEPLOYED_SHA: ${{ inputs.deployed_sha }}
        run: |
          set -euo pipefail
          [ "$CONFIRMATION" = "RESET-RECENT-CREATOR-TEST-ACCOUNTS" ] \
            || { echo "Confirmation text did not match; refusing reset."; exit 1; }
          [[ "$DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "The deployed SHA must be 40 lowercase hexadecimal characters."; exit 1; }
          [ "$DEPLOYED_SHA" = "$GITHUB_SHA" ] \
            || { echo "Dispatch the workflow from the exact commit you verified as deployed."; exit 1; }
          echo "sha=$DEPLOYED_SHA" >> "$GITHUB_OUTPUT"

      - name: AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify the running commit and execute the exact allowlisted reset
        env:
          EXPECTED_SHA: ${{ steps.inputs.outputs.sha }}
        run: |
          set -euo pipefail
          # The SHA assertion and Node process run inside one docker exec. This
          # binds the operation to the verified image rather than merely to a
          # container name that could otherwise be replaced between commands.
          REMOTE_COMMAND="sudo docker inspect -f '{{.State.Running}}' '$CONTAINER' | grep -Fxq true; sudo docker exec -e RESET_EXPECTED_SHA='$EXPECTED_SHA' '$CONTAINER' sh -c 'test \"\$GIT_SHA\" = \"\$RESET_EXPECTED_SHA\" && exec node /app/scripts/reset-recent-creator-test-accounts.mjs --execute'"
          PARAMETERS=$(jq -cn --arg command "$REMOTE_COMMAND" '{commands:[$command]}')
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "verified allowlisted recent creator test-account reset" \
            --timeout-seconds 300 \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          OUT=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text)
          ERR=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query 'StandardErrorContent' --output text)
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query 'Status' --output text)
          printf '%s\n' "$OUT"
          [ -z "$ERR" ] || printf '%s\n' "$ERR" >&2
          [ "$STATUS" = "Success" ] || { echo "Reset failed: $STATUS"; exit 1; }
