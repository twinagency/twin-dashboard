name: Approved sign-in upgrade preflight
on:
  push:
    branches: [codex/creator-seamless-connect-20261020]
    paths: ['.github/workflows/creator-sign-in-upgrade.yml']
permissions:
  contents: read
concurrency:
  group: twin-sign-in-upgrade
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Exact price, resize compatibility and dry-run permissions
        run: |
          python3 - <<'PY'
          import json,subprocess,decimal
          def command(*args,region='ap-southeast-2',dry=False):
              result=subprocess.run(['aws','--region',region,*args,'--output','json'],capture_output=True,text=True)
              if dry:
                  if 'DryRunOperation' not in result.stderr:raise RuntimeError(result.stderr[-2000:] or 'Dry-run permission check failed')
                  return None
              if result.returncode:raise RuntimeError(result.stderr[-2000:])
              return json.loads(result.stdout)
          instance='i-09a9dd3bd749643a5'
          i=command('ec2','describe-instances','--instance-ids',instance)['Reservations'][0]['Instances'][0]
          assert i['InstanceType'] in ['t3.small','t3.medium'] and i['Architecture']=='x86_64' and i['RootDeviceType']=='ebs'
          assert not i.get('InstanceLifecycle') and not any(t['Key']=='aws:autoscaling:groupName' for t in i.get('Tags',[]))
          addresses=command('ec2','describe-addresses','--filters','Name=instance-id,Values='+instance)['Addresses']
          print(json.dumps({'instanceType':i['InstanceType'],'rootDevice':i['RootDeviceType'],'architecture':i['Architecture'],'elasticIpCount':len(addresses),'ebsVolumeCount':len(i['BlockDeviceMappings'])}))
          if not addresses:raise RuntimeError('Stable public IP is not confirmed; do not stop the instance')
          prices={}
          for kind in ['t3.small','t3.medium']:
              filters=[{'Type':'TERM_MATCH','Field':k,'Value':v} for k,v in {'instanceType':kind,'location':'Asia Pacific (Sydney)','operatingSystem':'Linux','tenancy':'Shared','preInstalledSw':'NA','capacitystatus':'Used'}.items()]
              rows=command('pricing','get-products','--service-code','AmazonEC2','--filters',json.dumps(filters),'--max-results','10',region='us-east-1')['PriceList']
              values=set()
              for row in rows:
                  data=json.loads(row)
                  for offer in data.get('terms',{}).get('OnDemand',{}).values():
                      for price in offer['priceDimensions'].values():
                          if price['unit']=='Hrs' and price['beginRange']=='0':values.add(decimal.Decimal(price['pricePerUnit']['USD']))
              if len(values)!=1:raise RuntimeError('Standard Linux hourly price could not be confirmed for '+kind)
              prices[kind]=values.pop()
          extra=(prices['t3.medium']-prices['t3.small'])*decimal.Decimal(744)
          assert decimal.Decimal(0)<=extra<=decimal.Decimal(25),'Approved additional monthly compute limit exceeded'
          print(json.dumps({'usdHourly':{k:str(v) for k,v in prices.items()},'additionalComputeUsdPer31DayMonth':str(extra),'approvedAdditionalMonthlyLimitUsd':25,'excludes':'tax, unchanged storage/network and account-specific discounts'}))
          command('ec2','stop-instances','--instance-ids',instance,'--dry-run',dry=True)
          command('ec2','modify-instance-attribute','--instance-id',instance,'--instance-type','Value=t3.medium','--dry-run',dry=True)
          command('ec2','start-instances','--instance-ids',instance,'--dry-run',dry=True)
          for volume in i['BlockDeviceMappings']:
              command('ec2','create-snapshot','--volume-id',volume['Ebs']['VolumeId'],'--description','Twin approved sign-in upgrade recovery','--dry-run',dry=True)
          print('PASS pricing, stable IP, compatible upgrade and recovery/resize dry-run permissions. No instance changed.')
          PY
      - name: Read live release, compose paths and persistent mounts without environment values
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command --instance-ids i-09a9dd3bd749643a5 --document-name AWS-RunShellScript --comment 'Read live deployment metadata before approved resize' --parameters '{"commands":["sudo docker inspect next-app --format \"{{.Config.Image}} {{.HostConfig.RestartPolicy.Name}} {{.HostConfig.NetworkMode}}\"","sudo docker exec next-app printenv GIT_SHA","sudo docker inspect twin-onlyfans-api-1 twin-onlyfans-worker-1 twin-onlyfans-database-1 --format \"{{.Name}} {{.Config.Image}} {{index .Config.Labels \\\"com.docker.compose.project.working_dir\\\"}} {{index .Config.Labels \\\"com.docker.compose.project.config_files\\\"}} {{json .Mounts}}\"","sudo docker inspect flirt-bot flirt-dashboard --format \"{{.Name}} {{.HostConfig.RestartPolicy.Name}}\"","free -m","df -h /"]}' --query Command.CommandId --output text)
          for attempt in $(seq 1 40); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id i-09a9dd3bd749643a5 --query Status --output text 2>/dev/null || true)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 3
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id i-09a9dd3bd749643a5 --query '{status:Status,out:StandardOutputContent,err:StandardErrorContent}' --output json
          test "$STATUS" = Success
