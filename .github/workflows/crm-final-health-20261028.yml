name: CRM final health read 20261028
on:
  push:
    branches: [codex/crm-video-repairs-20261028]
    paths: [.github/workflows/crm-final-health-20261028.yml]
permissions:
  contents: read
jobs:
  read-only-health:
    if: github.repository == 'twinagency/twin-dashboard' && github.ref == 'refs/heads/codex/crm-video-repairs-20261028'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Read running versions, worker capability and exact CRM receipts
        run: |
          python3 - <<'PY'
          import base64,json,subprocess,time
          script="import json,subprocess,urllib.request,time\ndef inspect(n):return json.loads(subprocess.check_output(['docker','inspect',n]))[0]\nfor name in ['next-app','twin-onlyfans-api-1','twin-onlyfans-worker-1','twin-onlyfans-fastt-supervisor-1']:\n d=inspect(name);env=dict(x.split('=',1) for x in d['Config']['Env'] if '=' in x)\n print(json.dumps({'component':name,'image':d['Image'],'source':env.get('GIT_SHA') or (d['Config'].get('Labels') or {}).get('org.opencontainers.image.revision'),'running':d['State']['Running'],'restarts':d['RestartCount']}))\n assert d['State']['Running']\ncode=\"\"\"import os,json,time,urllib.request\nfrom onlyfans_read.contract import SCHEMA_VERSION,SCHEMA_VERSION_HEADER\nheaders={'Authorization':'Bearer '+os.environ['ONLYFANS_API_TOKEN'],SCHEMA_VERSION_HEADER:SCHEMA_VERSION}\ndef get(path):\n with urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8787/onlyfans/api/v1'+path,headers=headers),timeout=15) as r:return json.load(r)\nfor _ in range(12):\n accounts=get('/accounts')['accounts'];nicky=next(a for a in accounts if a['accountId']=='of-176774528')\n if nicky.get('deliveryResolutionOperational'):break\n time.sleep(5)\nassert nicky.get('deliveryResolutionOperational'),'Worker evidence capability has not become operational'\nfor a in accounts:\n print(json.dumps({'account':a['accountId'],'enabled':a.get('runtime',{}).get('enabled'),'sender':a.get('runtime',{}).get('sender',{}).get('state'),'resolutionCapability':a['capabilities']['resolveDeliveryEvidence'],'profileObserved':bool(a.get('creatorProfile',{}).get('observedAt')),'needsAttention':a.get('needsAttention')}))\npage=get('/accounts/of-176774528/conversations?q=%40u318022380')['page']['items']\nassert len(page)==1 and page[0]['accountId']=='of-176774528' and page[0]['fan']['fanId']=='318022380'\ndetail=get('/accounts/of-176774528/conversations/of-176774528:318022380')['conversation']\nmids={'11829924311011','11830187266684'};proof=[m for m in detail['messages'] if m['messageId'] in mids]\nassert {m['messageId'] for m in proof}==mids and all(m['delivery']=='sent' and m['origin']=='human' for m in proof)\nprint('crm_thread_receipts',[(m['messageId'],m['delivery'],m['origin'],m['occurredAt']) for m in proof])\nprint('conversation_mode',detail['summary']['automationMode'],detail['summary']['takeoverState'],detail['summary']['revision'])\nprint('spend_coverage',detail.get('spend'))\nprint('read_health_search_receipts','passed')\n\"\"\"\nsubprocess.run(['docker','exec','-i','twin-onlyfans-api-1','python','-c',code],check=True)\n"
          command="python3 -c \"import base64;exec(base64.b64decode('"+base64.b64encode(script.encode()).decode()+"'))\""
          def aws(*a):return json.loads(subprocess.check_output(['aws','--region','ap-southeast-2',*a,'--output','json'],text=True))
          assert aws('sts','get-caller-identity')['Account']=='323149985112'
          args={'InstanceIds':['i-09a9dd3bd749643a5'],'DocumentName':'AWS-RunShellScript','Comment':'Read-only final CRM health and receipt verification','Parameters':{'commands':[command],'executionTimeout':['180']}}
          key=aws('ssm','send-command','--cli-input-json',json.dumps(args))['Command']['CommandId'];print('SSM command',key,flush=True)
          for _ in range(65):
           try:r=aws('ssm','get-command-invocation','--command-id',key,'--instance-id','i-09a9dd3bd749643a5')
           except subprocess.CalledProcessError:time.sleep(3);continue
           if r['Status'] not in ('Pending','InProgress','Delayed'):
            print(r.get('StandardOutputContent',''));print('\n'.join(s for s in r.get('StandardErrorContent','').splitlines() if len(s)<500))
            assert r['Status']=='Success';break
           time.sleep(3)
          else:raise RuntimeError('Final read timed out')
          PY

