name: Katie V2 pacing inspection
on:
  push:
    branches: [codex/katie-message-pacing-20261030]
    paths: ['.github/workflows/katie-message-pacing.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Existing deployment identity
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Read only V2 reply pacing source
        env:
          TASK_PARAMETERS: "{\"commands\":[\"set -eu\\ncd /home/ubuntu/twin-v2\\ngit rev-parse HEAD\\ngit status --short | head -n 25\\nfor f in /AGENTS.md /home/AGENTS.md /home/ubuntu/AGENTS.md /home/ubuntu/twin-v2/AGENTS.md; do if [ -f \\\"$f\\\" ]; then cat \\\"$f\\\"; fi; done\\ngit ls-files | grep -E '(^|/)(AGENTS.md|package.json)$|\\\\.ts$' | head -n 85\\nrg -n --glob '*.ts' --glob '!node_modules/**' --glob '!**/node_modules/**' --glob '!scripts/**' --glob '!backups/**' 'response_wait_min|response_wait_max|bubble_delay|ONE text per reply|ALL lowercase|sendMessage|sleep\\\\(|setTimeout' . | head -n 100\\ndocker ps --filter name=twin-v2 --format '{{.Names}} {{.Image}} {{.Status}}'\"],\"executionTimeout\":[\"45\"]}"
        run: |
          set -euo pipefail
          printf '%s' "$TASK_PARAMETERS" > "$RUNNER_TEMP/katie-v2-inspect.json"
          COMMAND_ID=$(aws ssm send-command --instance-ids i-0584d283506f3f6be --document-name AWS-RunShellScript --comment 'Katie-only requested reply timing: read sender source; no runtime changes' --parameters "file://$RUNNER_TEMP/katie-v2-inspect.json" --query Command.CommandId --output text)
          for attempt in $(seq 1 35); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id i-0584d283506f3f6be --query Status --output text 2>/dev/null || true)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 3
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id i-0584d283506f3f6be --query '{status:Status,out:StandardOutputContent,err:StandardErrorContent}' --output json
          test "$STATUS" = Success
