name: Creator workspace verification
on:
  push:
    branches: [feat/creator-live-earnings-workspace, main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - middleware.ts
      - Dockerfile
      - package.json
      - "scripts/check-creator-*"
      - scripts/check-link-creator-signup.ts
      - scripts/check-tether-auth-ui.ts
      - scripts/check-reset-recent-creator-test-accounts.mjs
      - scripts/reset-recent-creator-test-accounts.mjs
      - .github/workflows/creator-workspace.yml
      - .github/workflows/reset-recent-creator-test-accounts.yml
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - middleware.ts
      - Dockerfile
      - package.json
      - "scripts/check-creator-*"
      - scripts/check-link-creator-signup.ts
      - scripts/check-tether-auth-ui.ts
      - scripts/check-reset-recent-creator-test-accounts.mjs
      - scripts/reset-recent-creator-test-accounts.mjs
      - .github/workflows/creator-workspace.yml
      - .github/workflows/reset-recent-creator-test-accounts.yml
permissions:
  contents: read
concurrency:
  group: creator-workspace-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Creator identity and permissions
        run: npx tsx scripts/check-creator-workspace.ts
      - name: Creator routing and direct agency signup isolation
        run: npm run test:creator-routing && npm run test:creator-login && npm run test:creator-live-demo && npm run test:tether-creator-signup && npm run test:link-creator-signup && npm run test:tether-auth-ui && npm run test:reset-creator-guardrails
      - name: Existing partner and revenue regression tests
        run: npm run test:offline
      - name: Production build
        run: npm run build
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Install browser
        run: npx playwright install chromium
      - name: Real earnings, mobile navigation, animated core and locked identity tabs
        run: node scripts/check-creator-ui.mjs
      - name: Tether and Link creator auth, onboarding and white-label branding
        run: node scripts/check-creator-branding.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creator-workspace-verification
          path: test-results/creator-workspace
          retention-days: 3
          if-no-files-found: ignore
