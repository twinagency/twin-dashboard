name: Instagram reader pagination repair
on:
  push:
    branches: [codex/instagram-reader-pagination-20261030]
    paths: [.github/workflows/instagram-reader-pagination-20261030.yml]
permissions:
  contents: read
concurrency:
  group: instagram-reader-maintenance
  cancel-in-progress: false
jobs:
  reader-check:
    if: github.repository == 'twinagency/twin-dashboard' && github.ref == 'refs/heads/codex/instagram-reader-pagination-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Existing server deployment connection
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Inspect only the Instagram reader
        shell: python
        run: |
          import base64,json,subprocess,time
          script = r"""
          import json,subprocess,pathlib,hashlib
          name='jesse-instagram-reader-instagram-reader-1'
          d=json.loads(subprocess.check_output(['docker','inspect',name],text=True))[0]
          labels=d['Config'].get('Labels') or {}
          print(json.dumps({'name':name,'running':d['State']['Running'],'image':d['Image'],'project':labels.get('com.docker.compose.project'),'working_dir':labels.get('com.docker.compose.project.working_dir'),'config_files':labels.get('com.docker.compose.project.config_files'),'mounts':[{'type':m['Type'],'name':m.get('Name'),'destination':m['Destination']} for m in d['Mounts']]}))
          root=pathlib.Path('/opt/jesse-instagram-reader')
          print('host entries:',sorted(p.name for p in root.iterdir() if not p.name.startswith('.')))
          for rel in ['bridge/service.py','bridge/reader.py','bridge/compose.yaml','compose.yaml']:
              p=root/rel
              if p.is_file(): print(rel,hashlib.sha256(p.read_bytes()).hexdigest())
          check="import pathlib,hashlib,json; print(json.dumps({f:hashlib.sha256(pathlib.Path('/app/bridge',f).read_bytes()).hexdigest() for f in ['service.py','reader.py']}))"
          subprocess.run(['docker','exec',name,'python','-c',check],check=True)
          """
          def aws(*args):
              return json.loads(subprocess.check_output(['aws','--region','ap-southeast-2',*args,'--output','json'],text=True))
          assert aws('sts','get-caller-identity')['Account']=='323149985112'
          encoded=base64.b64encode(script.encode()).decode()
          params={'InstanceIds':['i-09a9dd3bd749643a5'],'DocumentName':'AWS-RunShellScript','Comment':'Inspect Instagram reader for its pagination repair','Parameters':{'commands':["python3 -c \"import base64;exec(base64.b64decode('"+encoded+"'))\""],'executionTimeout':['90']}}
          job=aws('ssm','send-command','--cli-input-json',json.dumps(params))['Command']['CommandId']
          print('SSM command:',job,flush=True)
          for _ in range(40):
              try: result=aws('ssm','get-command-invocation','--command-id',job,'--instance-id','i-09a9dd3bd749643a5')
              except subprocess.CalledProcessError: time.sleep(3); continue
              if result['Status'] not in ('Pending','InProgress','Delayed'):
                  print(result.get('StandardOutputContent',''))
                  print(result.get('StandardErrorContent',''))
                  assert result['Status']=='Success',result['Status']
                  break
              time.sleep(3)
          else: raise RuntimeError('Inspect existing SSM command before retrying')
