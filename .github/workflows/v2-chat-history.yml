name: V2 chat history release
on:
  push:
    branches: [codex/v2-chat-history-90-release]
    paths:
      - .github/workflows/v2-chat-history.yml
permissions:
  contents: read
concurrency:
  group: v2-chat-history-release
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Read current V2 release and approved helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          commands = [
            "set -eu",
            "cd /home/ubuntu/twin-v2",
            "printf 'SOURCE REVISION\\n'; if [ -d .git ]; then git rev-parse HEAD; fi",
            "printf 'SOURCE HASHES\\n'; sha256sum src/config.ts src/memory.ts src/turn.ts",
            "printf 'RELEASE FILES\\n'; find . -maxdepth 1 -type f -not -name '.env*' -printf '%f\\n'",
            "printf 'COMPOSE STATUS\\n'; docker compose -p twin-v2 ps",
            "printf 'HELPER\\n'; sha256sum /root/twin-v2-release.sh; cat /root/twin-v2-release.sh"
          ]
          Path("/tmp/v2-inspect.json").write_text(json.dumps({"commands":commands,"executionTimeout":["120"]}))
          PY
          command_id=$(aws ssm send-command --instance-ids i-0584d283506f3f6be --document-name AWS-RunShellScript --comment "Inspect V2 for authorised 90-message dashboard history update" --parameters file:///tmp/v2-inspect.json --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$command_id" --instance-id i-0584d283506f3f6be || true
          aws ssm get-command-invocation --command-id "$command_id" --instance-id i-0584d283506f3f6be --query '{status:Status,out:StandardOutputContent,err:StandardErrorContent}' --output json
          test "$(aws ssm get-command-invocation --command-id "$command_id" --instance-id i-0584d283506f3f6be --query Status --output text)" = Success
