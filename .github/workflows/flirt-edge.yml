name: FLIRT dashboard edge route
on:
  push:
    branches: ["flirt/independent-backend-2026-09-19"]
    paths:
      - .github/workflows/flirt-edge.yml
  workflow_dispatch:

concurrency:
  group: flirt-dashboard-edge
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2
  INSTANCE_ID: i-09a9dd3bd749643a5

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Existing authorised AWS connection
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS account
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "323149985112"

      - name: Add FLIRT hostname and HTTPS without changing Twin
        run: |
          set -euo pipefail
          cat > /tmp/flirt-edge.sh <<'SCRIPT'
          set -euo pipefail

          test "$(docker inspect -f '{{.State.Running}}' flirt-dashboard)" = "true"
          curl -fsS http://127.0.0.1:3101/creator/login | grep -q "FLIRT"

          if ! getent ahostsv4 dashboard.flirtaiagency.com | awk '{print $1}' | grep -Fxq '15.135.97.139'; then
              echo 'DNS pending: add GoDaddy A record dashboard -> 15.135.97.139 for flirtaiagency.com.'
              exit 1
          fi

          cat > /etc/apache2/sites-available/dashboard.flirtaiagency.com.conf <<'APACHE'
          <VirtualHost *:80>
              ServerName dashboard.flirtaiagency.com
              LimitRequestBody 0
              ProxyTimeout 600
              ProxyPreserveHost On
              ProxyPass / http://127.0.0.1:3101/
              ProxyPassReverse / http://127.0.0.1:3101/
              ErrorLog ${APACHE_LOG_DIR}/flirt-dashboard-error.log
              CustomLog ${APACHE_LOG_DIR}/flirt-dashboard-access.log combined
          </VirtualHost>
          APACHE

          a2enmod proxy proxy_http ssl headers rewrite >/dev/null
          a2ensite dashboard.flirtaiagency.com.conf >/dev/null
          apache2ctl configtest
          systemctl reload apache2

          certbot --apache -d dashboard.flirtaiagency.com --non-interactive --redirect --keep-until-expiring

          apache2ctl configtest
          systemctl reload apache2

          curl -fsS https://dashboard.flirtaiagency.com/creator/login | grep -q "FLIRT"
          # Retired FLIRT GET/HEAD links retain their path and invitation code.
          # Keep all write requests behind the application's strict origin check.
          if docker exec flirt-dashboard printenv DASHBOARD_PUBLIC_ORIGIN | grep -Fxq 'https://dashboard.flirtaiagency.com'; then
              python3 - <<'REDIRECT'
          import re, subprocess
          from pathlib import Path
          paths = [Path('/etc/apache2/sites-available') / name for name in ('dashboard.lynqai.co.conf', 'dashboard.lynqai.co-le-ssl.conf')]
          originals = {}
          for path in paths:
              if not path.is_file(): continue
              content = path.read_text()
              if '# FLIRT legacy domain' in content: continue
              rule = ('    # FLIRT legacy domain\n    RewriteEngine On\n'
                      '    RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$\n'
                      '    RewriteRule ^ https://dashboard.flirtaiagency.com%{REQUEST_URI} [R=308,L,NE]\n')
              changed, count = re.subn(r'(\s*ServerName dashboard\.lynqai\.co[^\n]*\n)', lambda match: match.group(1) + rule, content)
              if count != 1: raise SystemExit('Legacy FLIRT proxy does not match expected hostname')
              originals[path] = content
              backup = path.with_suffix('.conf.before-flirtai-migration')
              if not backup.exists(): backup.write_text(content)
              path.write_text(changed)
          if subprocess.run(['apache2ctl', 'configtest']).returncode:
              for path, content in originals.items(): path.write_text(content)
              raise SystemExit('Restored legacy FLIRT proxy after validation failure')
          subprocess.run(['systemctl', 'reload', 'apache2'], check=True)
          REDIRECT
          fi
          echo "FLIRT edge route and HTTPS verified."
          SCRIPT

          python3 - <<'PY'
          import json
          from pathlib import Path
          script = Path('/tmp/flirt-edge.sh').read_text()
          Path('/tmp/flirt-edge.json').write_text(json.dumps({
              "commands": [script],
              "executionTimeout": ["600"]
          }))
          PY

          command_id=$(aws ssm send-command             --instance-ids "$INSTANCE_ID"             --document-name AWS-RunShellScript             --comment "Add FLIRT dashboard HTTPS route only"             --parameters file:///tmp/flirt-edge.json             --query Command.CommandId --output text)

          for i in {1..80}; do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query '{status:Status,out:StandardOutputContent,err:StandardErrorContent}' --output json
                exit 1
                ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query '{status:Status,out:StandardOutputContent,err:StandardErrorContent}' --output json
          test "$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text)" = "Success"

      - name: Verify new-domain invitations and retired-domain redirects
        env:
          FLIRT_EXPECTED_COMMIT: b484bc8f9b3f5e9b3a02b041eb2fd900db7d4d43
        run: python3 deployment/flirt-invites-live-check.py
