name: FLIRT optional onboarding verification
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Independently verified serving FLIRT commit (40 characters)"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  # Share the release lock: do not replace a container while fixtures are active.
  group: flirt-release-dashboard
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/flirt/independent-backend-2026-09-19'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check guarded normal-flow runner syntax
        run: |
          node --check deployment/creator-flow-live-check.cjs
          python3 -m py_compile deployment/creator-flow-live-check.py
      - name: Existing authorised AWS connection
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Normal signup, optional onboarding, small uploads and exact cleanup
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python3 deployment/creator-flow-live-check.py --brand=flirt --expected-sha="$EXPECTED_SHA" --mode=small-only --removal-guards
