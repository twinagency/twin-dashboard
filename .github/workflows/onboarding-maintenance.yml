name: Onboarding server maintenance
on:
  push:
    branches: ["codex/onboarding-maintenance-20261012"]
    paths:
      - .github/workflows/onboarding-maintenance.yml
      - deployment/onboarding-maintenance.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-dashboard
  cancel-in-progress: false
jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_REGION: ap-southeast-2
      INSTANCE_ID: i-09a9dd3bd749643a5
    steps:
      - uses: actions/checkout@v4
      - name: Validate maintenance script
        run: python3 -m py_compile deployment/onboarding-maintenance.py
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify account and inspect dashboard host
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = 323149985112
          python3 - <<'PY'
          import base64,json,pathlib
          code=base64.b64encode(pathlib.Path("deployment/onboarding-maintenance.py").read_bytes()).decode()
          command="printf '%s' '"+code+"' | base64 -d | sudo python3"
          pathlib.Path("/tmp/maintenance-command.json").write_text(json.dumps({"commands":[command],"executionTimeout":["720"]}))
          PY
          command_id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --comment "Authorised onboarding capacity and preview maintenance" --parameters file:///tmp/maintenance-command.json --query Command.CommandId --output text)
          status=Pending
          for attempt in $(seq 1 150); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text)
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query '{status:Status,out:StandardOutputContent,err:StandardErrorContent}' --output json
          test "$status" = Success
