name: Moxy optional onboarding edits
on:
  push:
    branches: ["fix/moxy-post-submit-edits-20261005"]
  pull_request:
    paths:
      - lib/creator-onboarding-policy.ts
      - scripts/check-moxy-post-submit-edit.cjs
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm}
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Moxy edits and retained agency, revision and consent boundaries
        run: node scripts/check-moxy-post-submit-edit.cjs
      - name: Existing creator flow, draft and optional onboarding
        run: npm run test:creator-flow && npm run test:creator-onboarding
      - name: Install fixture media tools
        run: command -v ffmpeg && command -v ffprobe || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Normal HTTP fixture runner safety
        run: node deployment/creator-flow-live-check.test.cjs
