name: FLIRT Overview live readback
on:
  push:
    branches: ["codex/flirt-callace-overview-20261011"]
    paths: [".github/workflows/flirt-overview-live-check.yml", "deployment/flirt-overview-live-check.cjs"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Verify the deployed default 30-day Overview
        env:
          FLIRT_EXPECTED_COMMIT: 7a5426025829eef9fbe8f443dd294db0bb5167ee
        run: |
          python3 - <<'PY'
          import runpy
          runner=runpy.run_path('deployment/flirt-optional-live-check.py')
          runner['main']('flirt-overview-live-check.cjs')
          PY
