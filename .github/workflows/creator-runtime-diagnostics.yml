name: Read-only interrupted test inventory
on:
  push:
    branches: ["fix/creator-runtime-diagnostics-2026-10-04"]
    paths: [".github/workflows/creator-runtime-diagnostics.yml"]
permissions:
  contents: read
concurrency:
  group: flirt-release-dashboard
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Identify only disposable test manifests and memory counters
        run: python3 deployment/creator-runtime-diagnostics.py
