name: Creator live flow acceptance
on:
  push:
    branches: ["fix/creator-runtime-diagnostics-2026-10-04"]
    paths: [".github/workflows/creator-runtime-diagnostics.yml"]
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: node scripts/check-creator-storage-transport.cjs
