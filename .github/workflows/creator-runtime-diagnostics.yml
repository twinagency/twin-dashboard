name: Verify FLIRT actual-duration media without stale fixture-client connections
on:
  push:
    branches: ["fix/creator-runtime-diagnostics-2026-10-04"]
    paths: [".github/workflows/creator-runtime-diagnostics.yml"]
permissions:
  contents: read
concurrency:
  group: flirt-release-dashboard
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate isolated fixture cleanup and runtime guards
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          node deployment/creator-flow-live-check.test.cjs
          node deployment/creator-flow-cleanup.test.cjs
          node deployment/creator-flow-upload-memory.test.cjs
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Verify FLIRT real media using fresh test-client HTTP connections
        run: python3 deployment/creator-flow-live-check.py --brand=flirt --expected-sha=e528eb6066477d33a50b68d58d4fea1de5cff681 --mode=realistic --removal-guards
