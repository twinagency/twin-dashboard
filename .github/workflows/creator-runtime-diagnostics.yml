name: FLIRT live upload size boundaries
on:
  push:
    branches: ["fix/creator-runtime-diagnostics-2026-10-04"]
    paths: [".github/workflows/creator-runtime-diagnostics.yml"]
permissions:
  contents: read
concurrency:
  group: flirt-release-dashboard
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Real public transfer and persisted object byte boundaries
        run: python3 deployment/creator-flow-live-check.py --brand=flirt --expected-sha=ae3fab46068cd9c7ecefb6014d82c3be2342e867 --mode=large --allow-missing-gallery
