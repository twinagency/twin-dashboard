name: Clean exact interrupted fixtures and verify corrected FLIRT upload transport
on:
  push:
    branches: ["fix/creator-runtime-diagnostics-2026-10-04"]
    paths: [".github/workflows/creator-runtime-diagnostics.yml"]
permissions:
  contents: read
concurrency:
  group: flirt-release-dashboard
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify fixture cleanup guards and bounded client memory
        run: |
          node deployment/creator-flow-cleanup.test.cjs
          node deployment/creator-flow-upload-memory.test.cjs
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Preserve exact manifests from retained original containers
        run: python3 deployment/creator-runtime-diagnostics.py
      - name: Verify first interrupted fixture prefixes are empty
        run: python3 deployment/creator-flow-live-check.py --brand=flirt --expected-sha=30989771efd5fac85ca387fbe739c1552594c166 --mode=cleanup-only --cleanup-manifest=/tmp/creator-flow-flirt-gKoiGn/cleanup-manifest.json
      - name: Clean second interrupted fixture with orphan checks
        run: python3 deployment/creator-flow-live-check.py --brand=flirt --expected-sha=30989771efd5fac85ca387fbe739c1552594c166 --mode=cleanup-only --cleanup-manifest=/tmp/creator-flow-flirt-IGAmiF/cleanup-manifest.json
      - name: Verify corrected live FLIRT transport at byte boundaries
        run: python3 deployment/creator-flow-live-check.py --brand=flirt --expected-sha=30989771efd5fac85ca387fbe739c1552594c166 --mode=large --allow-missing-gallery
