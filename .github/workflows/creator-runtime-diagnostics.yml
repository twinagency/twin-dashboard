name: Verify branded creator password recovery configuration
on:
  push:
    branches: ["fix/creator-runtime-diagnostics-2026-10-04"]
    paths: [".github/workflows/creator-runtime-diagnostics.yml"]
permissions:
  contents: read
concurrency:
  group: flirt-release-dashboard
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate fixture cleanup guards
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          node deployment/creator-flow-live-check.test.cjs
          node deployment/creator-flow-cleanup.test.cjs
      - uses: aws-actions/configure-aws-credentials@v4
        id: runtime_auth
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Verify Moxy recovery redirects and normal flow with exact cleanup
        run: python3 deployment/creator-flow-live-check.py --brand=moxy --expected-sha=a5c7f1cf1f84d478639a522eb64339d591d8ff77 --mode=flow-only
      - name: Verify FLIRT recovery redirects and normal flow with exact cleanup
        if: always() && steps.runtime_auth.outcome == 'success'
        run: python3 deployment/creator-flow-live-check.py --brand=flirt --expected-sha=e528eb6066477d33a50b68d58d4fea1de5cff681 --mode=flow-only
