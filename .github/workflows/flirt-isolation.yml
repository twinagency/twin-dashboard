name: FLIRT white-label checks
on:
  push:
    branches: ["flirt/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Shared providers and separate customer data
        run: npm run test:flirt-isolation
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build without live credentials
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Existing offline checks
        run: npm run test:offline
      - name: Creator signup and onboarding regression checks
        run: npm run test:creator-routing && npm run test:creator-login && npm run test:creator-onboarding
