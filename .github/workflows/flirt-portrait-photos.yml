name: FLIRT portrait photo selection
on:
  push:
    branches: ["codex/flirt-hero-photos-20261011"]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - run: python3 deployment/flirt-agency-review.py
      - uses: actions/upload-artifact@v4
        with:
          name: flirt-portrait-candidates
          path: /tmp/flirt-agency-review
          retention-days: 1
