name: Diagnose anonymous sign-in resources
on:
  push:
    branches: [codex/creator-seamless-connect-20261020]
    paths: ['.github/workflows/creator-sign-in-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - run: node deployment/creator-sign-in-diagnostic.cjs
# Read-only anonymous provider resource diagnostic.
