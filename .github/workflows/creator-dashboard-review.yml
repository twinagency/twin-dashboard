name: Creator dashboard review
on:
  push:
    branches: [fix/creator-shared-dashboard]
permissions:
  contents: read
jobs:
  source-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package tracked source for offline review
        run: git archive --format=tar.gz -o /tmp/creator-dashboard-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: creator-dashboard-source
          path: /tmp/creator-dashboard-source.tar.gz
          retention-days: 1
