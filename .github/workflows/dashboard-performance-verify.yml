# Read-only: logs contain timings and hashes, never credentials or fan records.
name: Dashboard performance live verification
on:
  push:
    branches: [codex/dashboard-performance-verify-20261021]
    paths: [.github/workflows/dashboard-performance-verify.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Measure complete authenticated page response and shared API latency
        shell: python
        run: |
          import json, pathlib, shlex, subprocess, time
          code = "const fs=require('fs'),crypto=require('crypto');\nconst sign=p=>p+'.'+crypto.createHmac('sha256',process.env.DASHBOARD_SESSION_SECRET||process.env.DASHBOARD_PASSWORD).update(p).digest('base64url');\nconst cookie='allie_admin_session='+sign(String(Date.now()+600000));\nconst brands=[{brand:process.env.PERF_BRAND||'Twin',cookie}];\n(async()=>{\n if(process.env.PERF_BRAND!=='Flirt'){\n const r=await fetch(process.env.SUPABASE_URL+'/rest/v1/partner_agencies?select=id&slug=eq.moxy&active=eq.true',{headers:{apikey:process.env.SUPABASE_SERVICE_KEY,Authorization:'Bearer '+process.env.SUPABASE_SERVICE_KEY}});\n const agencies=await r.json();if(agencies[0]){const p=Buffer.from(JSON.stringify({targetType:'agency',targetId:agencies[0].id,admin:'performance-check',exp:Date.now()+600000})).toString('base64url');brands.push({brand:'Moxy',cookie:cookie+'; twin_admin_view_as='+sign(p)});}\n }\n const baseline={Twin:{ms:4590,bytes:409443,fingerprint:\"11076559339199f593cdd2c9f586a5c64bac0f70864bc5f43827517c385d11bf\"},Moxy:{ms:2390,bytes:48382,fingerprint:\"ef503eba589f77c1f64f497847eecee3971a32516f0ce0e21675e88afe48c2fd\"},Flirt:{ms:2706,bytes:227321,fingerprint:\"5be03703ea4a1a7b2f7aa523fcae6721f6fed27d290cf117da19e05e0461300a\"}};\n const expected=process.env.PERF_BRAND==='Flirt'?['b3fb3c5c2857473b175a9882e2d805e795514e99']:['6c1ce5c7df0d67b0e1acb1c1d0d5b5a250bb4437','4e5fe88c2224340d8f516afe5980bc0b197752ae'];\n const results=[];\n for(const b of brands){ for(const mode of ['summary-fresh','full-fresh','summary-warm']) {\n const path='/api/dashboard?startDate=2026-10-01&endDate=2026-10-20&fresh='+(mode.endsWith('warm')?'1':'force')+(mode.startsWith('summary')?'&summary=1':'');\n const start=performance.now();const r=await fetch('http://127.0.0.1:'+(process.env.PORT||3001)+path,{headers:{cookie:b.cookie,host:b.brand==='Moxy'?'dashboard.lynqai.co':b.brand==='Flirt'?'dashboard.flirtaiagency.com':'dashboard.tgaiclone.xyz'},signal:AbortSignal.timeout(120000)});\n const text=await r.text();let j={};try{j=JSON.parse(text)}catch{}\n const pick=x=>x&&({stars:x.stars,grossPaymentStars:x.grossPaymentStars,sales:x.sales,buyers:x.buyers});\n const conv=j.overviewConversion??j.analytics?.buyerConversion;const values={totals:pick(j.totals),perClone:Object.fromEntries(Object.entries(j.perClone||{}).sort().map(([k,v])=>[k,pick(v)])),conversion:conv&&{activeChatters:conv.activeChatters,activeChatBuyers:conv.activeChatBuyers,activeChatBuyerRate:conv.activeChatBuyerRate}};\n const result={brand:b.brand,mode,sha:process.env.GIT_SHA,status:r.status,ms:Math.round(performance.now()-start),bytes:Buffer.byteLength(text),recent:j.recent?.length,fingerprint:crypto.createHash('sha256').update(JSON.stringify(values)).digest('hex'),error:j.error};\n result.rankItems=j.rankings?.content?.length;\n result.visibleFingerprint=crypto.createHash('sha256').update(JSON.stringify({series:j.series,rankings:j.rankings&&{...j.rankings,content:j.rankings.content.map(({url,...x})=>x)},recent:j.recent?.slice(0,5).map(({mediaUrl,...x})=>x)})).digest('hex');\n result.sameFigures=result.fingerprint===baseline[b.brand].fingerprint;\n result.baselineMs=baseline[b.brand].ms;result.baselineBytes=baseline[b.brand].bytes;\n results.push(result);console.log(JSON.stringify(result));\n if(r.status!==200||!result.sameFigures)throw Error(b.brand+' '+mode+' failed exact figure comparison');\n if(mode.startsWith('summary')&&(j.analytics!==null||j.recent.length>5))throw Error('Summary payload contract failed');\n }\n }\n})().catch(e=>{console.error(e.message);process.exitCode=1});\n\n"
          commands = ["sudo docker stats --no-stream --format '{{.Name}} CPU={{.CPUPerc}} MEM={{.MemUsage}}' next-app flirt-dashboard", "uptime", "sudo docker exec -i next-app node -e " + shlex.quote(code), "sudo docker exec -i -e PERF_BRAND=Flirt flirt-dashboard node -e " + shlex.quote(code)]
          path = pathlib.Path("/tmp/performance-parameters.json")
          path.write_text(json.dumps({"commands": commands, "executionTimeout": ["600"]}))
          cid = subprocess.check_output(["aws","ssm","send-command","--instance-ids","i-09a9dd3bd749643a5","--document-name","AWS-RunShellScript","--parameters","file://"+str(path),"--comment","Read-only dashboard performance and financial parity verification","--query","Command.CommandId","--output","text"],text=True).strip()
          print("Command:", cid, flush=True)
          for attempt in range(120):
              try:
                  result = json.loads(subprocess.check_output(["aws","ssm","get-command-invocation","--command-id",cid,"--instance-id","i-09a9dd3bd749643a5","--output","json"],text=True,stderr=subprocess.DEVNULL))
              except subprocess.CalledProcessError:
                  time.sleep(3)
                  continue
              if result["Status"] in ["Success","Failed","Cancelled","TimedOut"]:
                  print(result.get("StandardOutputContent",""),flush=True)
                  if result["Status"] != "Success":
                      print(result.get("StandardErrorContent","")[-1500:],flush=True)
                      raise RuntimeError("Performance verification "+result["Status"])
                  break
              time.sleep(3)
          else:
              raise RuntimeError("Performance verification timeout")
