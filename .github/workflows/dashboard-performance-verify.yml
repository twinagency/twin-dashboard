# Read-only: logs contain timings and hashes, never credentials or fan records.
name: Dashboard performance live verification
on:
  push:
    branches: [codex/dashboard-performance-verify-20261021]
    paths: [.github/workflows/dashboard-performance-verify.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Measure complete authenticated page response and shared API latency
        shell: python
        run: |
          import json, pathlib, shlex, subprocess, time
          code = "const crypto=require('crypto');\nconst sign=p=>p+'.'+crypto.createHmac('sha256',process.env.DASHBOARD_SESSION_SECRET||process.env.DASHBOARD_PASSWORD).update(p).digest('base64url');\nconst admin='allie_admin_session='+sign(String(Date.now()+600000));\n(async()=>{\nconst brands=[{name:process.env.PERF_BRAND||'Twin',cookie:admin,host:process.env.PERF_BRAND==='Flirt'?'dashboard.flirtaiagency.com':'dashboard.tgaiclone.xyz'}];\nif(process.env.PERF_BRAND!=='Flirt') {const r=await fetch(process.env.SUPABASE_URL+'/rest/v1/partner_agencies?select=id&slug=eq.moxy&active=eq.true',{headers:{apikey:process.env.SUPABASE_SERVICE_KEY,Authorization:'Bearer '+process.env.SUPABASE_SERVICE_KEY}}); const a=await r.json();if(a[0]){const p=Buffer.from(JSON.stringify({targetType:'agency',targetId:a[0].id,admin:'performance-check',exp:Date.now()+600000})).toString('base64url');brands.push({name:'Moxy',host:'dashboard.lynqai.co',cookie:admin+'; twin_admin_view_as='+sign(p)});}}\nfor(const b of brands){for(const path of [b.name==='Twin'?'/dashboard':'/revenue','/api/dashboard?period=1M&fresh=1&summary=1','/api/dashboard?period=1M&fresh=1&summary=1',b.name==='Twin'?'/dashboard':'/revenue','/clones']) {const t=performance.now();try{const r=await fetch('http://127.0.0.1:'+(process.env.PORT||3001)+path,{headers:{cookie:b.cookie,host:b.host},redirect:'manual',signal:AbortSignal.timeout(90000)});const headersMs=performance.now()-t; const body=await r.text(); console.log(JSON.stringify({brand:b.name,sha:process.env.GIT_SHA,path,status:r.status,headersMs:Math.round(headersMs),totalMs:Math.round(performance.now()-t),bytes:Buffer.byteLength(body),scripts:[...body.matchAll(/<script[^>]+src=\"([^\"]+)\"/g)].map(m=>m[1]).length}));}catch(e){console.log(JSON.stringify({brand:b.name,path,error:e.name,ms:Math.round(performance.now()-t)}));}}}\n})().catch(e=>{console.error(e.message);process.exitCode=1});\n"
          commands = ["sudo docker stats --no-stream --format '{{.Name}} CPU={{.CPUPerc}} MEM={{.MemUsage}}' next-app flirt-dashboard", "uptime", "sudo docker exec -i next-app node -e " + shlex.quote(code), "sudo docker exec -i -e PERF_BRAND=Flirt flirt-dashboard node -e " + shlex.quote(code)]
          path = pathlib.Path("/tmp/performance-parameters.json")
          path.write_text(json.dumps({"commands": commands, "executionTimeout": ["600"]}))
          cid = subprocess.check_output(["aws","ssm","send-command","--instance-ids","i-09a9dd3bd749643a5","--document-name","AWS-RunShellScript","--parameters","file://"+str(path),"--comment","Read-only dashboard performance and financial parity verification","--query","Command.CommandId","--output","text"],text=True).strip()
          print("Command:", cid, flush=True)
          for attempt in range(120):
              try:
                  result = json.loads(subprocess.check_output(["aws","ssm","get-command-invocation","--command-id",cid,"--instance-id","i-09a9dd3bd749643a5","--output","json"],text=True,stderr=subprocess.DEVNULL))
              except subprocess.CalledProcessError:
                  time.sleep(3)
                  continue
              if result["Status"] in ["Success","Failed","Cancelled","TimedOut"]:
                  print(result.get("StandardOutputContent",""),flush=True)
                  if result["Status"] != "Success":
                      print(result.get("StandardErrorContent","")[-1500:],flush=True)
                      raise RuntimeError("Performance verification "+result["Status"])
                  break
              time.sleep(3)
          else:
              raise RuntimeError("Performance verification timeout")
