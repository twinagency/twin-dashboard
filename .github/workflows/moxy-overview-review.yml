name: Moxy overview review
on:
  push:
    branches: [codex/moxy-agency-overview-20261011]
    paths: ['.github/workflows/moxy-overview-review.yml', 'deployment/moxy-overview-*']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive HEAD -o /tmp/moxy-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: moxy-overview-source
          path: /tmp/moxy-source.tar.gz
          retention-days: 1
