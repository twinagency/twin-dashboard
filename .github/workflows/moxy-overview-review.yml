name: Moxy overview review
on:
  push:
    branches: [codex/moxy-agency-overview-20261011]
    paths: ['.github/workflows/moxy-overview-review.yml', 'deployment/moxy-overview-*']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - run: python3 deployment/moxy-overview-photos.py
      - uses: actions/upload-artifact@v4
        with:
          name: moxy-overview-photos
          path: /tmp/moxy-review
          retention-days: 1
