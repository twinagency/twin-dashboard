name: FLIRT chat history finish
on:
  push:
    branches: [codex/v2-chat-history-90-release]
    paths: [.github/workflows/flirt-history-finish.yml, deployment/flirt-history-cleanup.py]
permissions:
  contents: read
concurrency:
  group: flirt-release-dashboard
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Clear only reproducible unused cache
        run: python3 deployment/flirt-history-cleanup.py
