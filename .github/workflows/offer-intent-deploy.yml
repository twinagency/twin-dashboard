name: Deploy reviewed Twin V2 offer-intent release
on:
  push:
    branches: [codex/v2-offer-intent-deploy-20261014]
    paths:
      - deployment/deploy-offer-intent.py
      - deployment/offer-intent-workflow.py
      - .github/workflows/offer-intent-deploy.yml
permissions:
  contents: write
concurrency:
  group: twin-v2-production-operations
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Drain, install, verify and release the pinned candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OFFER_PHASE: deploy
        run: python3 deployment/offer-intent-workflow.py
