name: Olivia Jade requested dashboard setup
on:
  push:
    branches: ["flirt/independent-backend-2026-09-19"]
    paths:
      - deployment/olivia-setup-request.json
permissions:
  contents: read
concurrency:
  group: olivia-jade-dashboard-setup
  cancel-in-progress: false
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify creator scope and source syntax
        run: |
          node --test deployment/flirt-live-twin.test.cjs
          python3 -m py_compile deployment/olivia-dashboard-setup.py
      - name: Existing authorized AWS connection
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Set Olivia photo and refresh her existing login
        env:
          FLIRT_SUPABASE_SERVICE_KEY: ${{ secrets.FLIRT_SUPABASE_SERVICE_KEY }}
        run: python3 deployment/olivia-dashboard-setup.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: olivia-encrypted-setup-result
          path: deployment/olivia-setup-result.json
          retention-days: 1
