name: Build sharp creator verification browser
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  ECR_REPO: 323149985112.dkr.ecr.ap-southeast-2.amazonaws.com/twin-dashboard
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply only the reviewed browser changes to the approved source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release native
          gh release download creator-sign-in-0525e51-20261020 --repo "$GITHUB_REPOSITORY" --pattern twin-native-0525e51-release.tar --dir release
          echo '5eead8614969a6833e3f9dfb48c9870c3e8eaeccf9299af139ae930e8fd3fb7f  release/twin-native-0525e51-release.tar' | sha256sum --check
          tar -xf release/twin-native-0525e51-release.tar -C native
          python3 - <<'PY'
          import pathlib
          for name in ('service.mjs','check.mjs','server.mjs'):
              p=pathlib.Path('native/creator-sign-in')/name
              p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n'))
          PY
          echo '4f6c639ab3f9c468962d7a0b4e4366ff3f140d89a04b4da026cc6dfbc6b256f6  native/creator-sign-in/service.mjs' | sha256sum --check
          echo '9fd181a999f0bb00316dfae18f8df6af9cd9525ef8d6d548c4d42572b88f4c5e  native/creator-sign-in/check.mjs' | sha256sum --check
          echo 'ed1d61113b6756eadcf0da53a13c08b7663c11493ece2e3e79ef0af550aee342  native/creator-sign-in/server.mjs' | sha256sum --check
          git apply --check --directory=native deployment/creator-sign-in-polish-native.patch
          git apply --directory=native deployment/creator-sign-in-polish-native.patch
          echo '7c1344f02ffd83bdb4ac211315a077d8277b85ea704fdeda0b39f108a37992c4  native/creator-sign-in/service.mjs' | sha256sum --check
          echo 'b99372f0b653461428066f14d92c0587a41e024b898aeb45d79aff71247f1abd  native/creator-sign-in/check.mjs' | sha256sum --check
          echo '38a1b8ac703b83312b3a2e93bca0e0b0f4ff31990a58584baae4417c420c27a8  native/creator-sign-in/server.mjs' | sha256sum --check
      - name: Build and verify the private browser
        run: |
          docker build --label org.opencontainers.image.revision=1aee00e056492653a2a8963366949ae7c48fce6a -f native/Dockerfile.sign-in -t "$ECR_REPO:signin-polish-$GITHUB_SHA" native
          docker run --rm --init --user pwuser --read-only --cap-drop ALL --security-opt no-new-privileges --security-opt seccomp=native/deploy/creator-sign-in-seccomp.json --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777 --shm-size=256m --memory=1536m --cpus=1 --pids-limit=256 -e TWIN_SIGNIN_TEST_HEADED=1 -e TWIN_SIGNIN_TEST_SANDBOX=1 "$ECR_REPO:signin-polish-$GITHUB_SHA" xvfb-run -a node creator-sign-in/check.mjs
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Publish the tested browser
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker push "$ECR_REPO:signin-polish-$GITHUB_SHA"
          BROWSER=$(docker inspect --format='{{index .RepoDigests 0}}' "$ECR_REPO:signin-polish-$GITHUB_SHA")
          jq -n --arg source 1aee00e056492653a2a8963366949ae7c48fce6a --arg image "$BROWSER" '{source:$source,browserImage:$image}' > creator-sign-in-polish-browser.json
          gh release upload creator-sign-in-0525e51-20261020 creator-sign-in-polish-browser.json --repo "$GITHUB_REPOSITORY" --clobber
