name: Build mobile sign-in and verification fix
on:
  workflow_dispatch:
  push:
    branches: [codex/creator-seamless-connect-20261020]
    paths: ['.github/workflows/creator-sign-in-input-fix.yml']
permissions:
  contents: write
env:
  ECR_REPO: 323149985112.dkr.ecr.ap-southeast-2.amazonaws.com/twin-dashboard
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reuse the approved private source archive with the reviewed sign-in-only patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release native
          gh release download creator-sign-in-0525e51-20261020 --repo "$GITHUB_REPOSITORY" --pattern twin-native-0525e51-release.tar --dir release
          echo '5eead8614969a6833e3f9dfb48c9870c3e8eaeccf9299af139ae930e8fd3fb7f  release/twin-native-0525e51-release.tar' | sha256sum --check
          tar -xf release/twin-native-0525e51-release.tar -C native
          python3 - <<'PY'
          import pathlib
          for name in ('service.mjs', 'check.mjs'):
              p = pathlib.Path('native/creator-sign-in') / name
              p.write_bytes(p.read_bytes().replace(b'\r\n', b'\n'))
          PY
          echo '4f6c639ab3f9c468962d7a0b4e4366ff3f140d89a04b4da026cc6dfbc6b256f6  native/creator-sign-in/service.mjs' | sha256sum --check
          echo '9fd181a999f0bb00316dfae18f8df6af9cd9525ef8d6d548c4d42572b88f4c5e  native/creator-sign-in/check.mjs' | sha256sum --check
          git apply --check --directory=native deployment/creator-sign-in-mobile-native.patch
          git apply --directory=native deployment/creator-sign-in-mobile-native.patch
          echo 'f3274af5ad3bb69dd4451af8b2933c560f2aec0f8ab48be8d6846e417f38807b  native/creator-sign-in/service.mjs' | sha256sum --check
          echo 'e5d406d645146194399ffa7985b51c0fca6cd51821aa46b8fbf870557bd21544  native/creator-sign-in/check.mjs' | sha256sum --check

      - name: Build and verify private browser
        run: |
          docker build --label org.opencontainers.image.revision=f76f37f7daba18bed1951aa55832127b5a988994 -f native/Dockerfile.sign-in -t "$ECR_REPO:signin-input-$GITHUB_SHA" native
          docker run --rm --init --user pwuser --read-only --cap-drop ALL --security-opt no-new-privileges --security-opt seccomp=native/deploy/creator-sign-in-seccomp.json --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777 --shm-size=256m --memory=1536m --cpus=1 --pids-limit=256 -e TWIN_SIGNIN_TEST_HEADED=1 -e TWIN_SIGNIN_TEST_SANDBOX=1 "$ECR_REPO:signin-input-$GITHUB_SHA" xvfb-run -a node creator-sign-in/check.mjs
      - name: Build dashboard
        run: docker build --build-arg GIT_SHA="$GITHUB_SHA" -t "$ECR_REPO:$GITHUB_SHA" .
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Push pinned images
        run: |
          docker push "$ECR_REPO:$GITHUB_SHA"
          docker push "$ECR_REPO:signin-input-$GITHUB_SHA"
          DASHBOARD=$(docker inspect --format='{{index .RepoDigests 0}}' "$ECR_REPO:$GITHUB_SHA")
          BROWSER=$(docker inspect --format='{{index .RepoDigests 0}}' "$ECR_REPO:signin-input-$GITHUB_SHA")
          jq -n --arg commit "$GITHUB_SHA" --arg dashboard "$DASHBOARD" --arg browser "$BROWSER" '{dashboardCommit:$commit,dashboardImage:$dashboard,browserImage:$browser}' > creator-sign-in-input-images.json
      - name: Save manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload creator-sign-in-0525e51-20261020 creator-sign-in-input-images.json --repo "$GITHUB_REPOSITORY" --clobber
