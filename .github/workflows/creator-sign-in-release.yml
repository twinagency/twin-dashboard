name: Build private sign-in release
on:
  push:
    branches: [codex/creator-seamless-connect-20261020]
    paths: ['.github/workflows/creator-sign-in-release.yml']
permissions:
  contents: write
concurrency:
  group: twin-sign-in-release-images
  cancel-in-progress: false
env:
  ECR_REPO: 323149985112.dkr.ecr.ap-southeast-2.amazonaws.com/twin-dashboard
  NATIVE_SHA: 0525e51aa690b44d1c9f1dc0bc2b9aed6baa627a
jobs:
  images:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download exact native source export from the private draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release native
          gh release download creator-sign-in-0525e51-20261020 --repo "$GITHUB_REPOSITORY" --pattern twin-native-0525e51-release.tar --dir release
          echo '5eead8614969a6833e3f9dfb48c9870c3e8eaeccf9299af139ae930e8fd3fb7f  release/twin-native-0525e51-release.tar' | sha256sum --check
          tar -xf release/twin-native-0525e51-release.tar -C native
      - name: Build runtime and browser from the same pinned native source
        run: |
          docker build --label org.opencontainers.image.revision="$NATIVE_SHA" -f native/Dockerfile.onlyfans -t "$ECR_REPO:native-$NATIVE_SHA" native
          docker build --label org.opencontainers.image.revision="$NATIVE_SHA" -f native/Dockerfile.sign-in -t "$ECR_REPO:signin-$NATIVE_SHA" native
      - name: Verify the packaged headed browser with the production sandbox controls
        run: |
          docker run --rm --init --user pwuser --read-only --cap-drop ALL --security-opt no-new-privileges --security-opt seccomp=native/deploy/creator-sign-in-seccomp.json --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777 --shm-size=256m --memory=1536m --cpus=1 --pids-limit=256 -e TWIN_SIGNIN_TEST_HEADED=1 -e TWIN_SIGNIN_TEST_SANDBOX=1 "$ECR_REPO:signin-$NATIVE_SHA" xvfb-run -a node creator-sign-in/check.mjs
      - name: Existing scoped deployment credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Push immutable release images and record exact digests
        run: |
          docker push "$ECR_REPO:native-$NATIVE_SHA"
          docker push "$ECR_REPO:signin-$NATIVE_SHA"
          RUNTIME=$(docker inspect --format='{{index .RepoDigests 0}}' "$ECR_REPO:native-$NATIVE_SHA")
          BROWSER=$(docker inspect --format='{{index .RepoDigests 0}}' "$ECR_REPO:signin-$NATIVE_SHA")
          jq -n --arg native "$NATIVE_SHA" --arg runtime "$RUNTIME" --arg browser "$BROWSER" --arg dashboard "$GITHUB_SHA" '{nativeCommit:$native,dashboardCommit:$dashboard,runtimeImage:$runtime,browserImage:$browser,sourceArchiveSha256:"5eead8614969a6833e3f9dfb48c9870c3e8eaeccf9299af139ae930e8fd3fb7f"}' > release/creator-sign-in-images.json
          cat release/creator-sign-in-images.json
      - name: Retain deployment manifest on the private draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload creator-sign-in-0525e51-20261020 release/creator-sign-in-images.json --repo "$GITHUB_REPOSITORY" --clobber
