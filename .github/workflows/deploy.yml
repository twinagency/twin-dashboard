# Push to main -> image built HERE, pushed to ECR, box pulls it by DIGEST.
#
# WHY THIS EXISTS
# The old path SSHed to a home desktop, rsynced SOURCE to EC2 over Tailscale,
# and ran `docker build` ON THE PRODUCTION BOX - competing with a live payment
# bot for 1.9GB of RAM, with no name for "what is deployed" other than
# "whatever happened to be on that disk". That is exactly how both boxes ended
# up serving 25-hour-old images while commits sat pushed and believed-deployed.
#
# The deploy identity is an OIDC role, so there is NO long-lived AWS key in
# GitHub. The box pulls by DIGEST, never by :latest - a tag can move under you,
# a digest cannot, and "what is running" becomes a thing you look up instead of
# a thing you guess.
name: deploy-dashboard

on:
  push:
    branches: [main]
    # A docs-only push must not bounce a live container. Nothing in here is
    # copied into the image, so rebuilding on it buys nothing and costs a
    # restart of a bot that is mid-conversation with paying fans.
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - 'archive/**'
  workflow_dispatch:
    inputs:
      ref:
        description: "commit to deploy (defaults to the pushed one)"
        required: false

concurrency:
  # One deployer at a time. A deploy rsynced/pulled while another is mid-flight
  # is how someone's half-finished edit ships. Do NOT cancel in progress - a
  # half-applied container swap is worse than a queued deploy.
  group: deploy-dashboard
  cancel-in-progress: false

permissions:
  id-token: write      # required for OIDC
  contents: read

env:
  AWS_REGION: ap-southeast-2
  ECR_REPO: 323149985112.dkr.ecr.ap-southeast-2.amazonaws.com/twin-dashboard
  INSTANCE_ID: i-09a9dd3bd749643a5
  CONTAINER: next-app
  REMOTE_DIR: /home/ubuntu/allieai2-dashboard
  # Dashboard binds 3001 internally; Apache proxies to 127.0.0.1:3001 on the
  # host, so the port MUST be published or every request 503s while docker
  # inspect still says Running: true. The bot needs no such flags.
  EXTRA_RUN_ARGS: "-p 127.0.0.1:3001:3001 -e PORT=3001 --network twin-onlyfans_default"

jobs:
  creator-uploads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.inputs.ref || github.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Video validation tools
        timeout-minutes: 7
        run: |
          if [ -f scripts/install-ci-video-tools.sh ]; then
            bash scripts/install-ci-video-tools.sh
          else
            command -v ffmpeg && command -v ffprobe || (sudo timeout --kill-after=10s 150s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=30 update && sudo timeout --kill-after=10s 210s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=30 install -y --no-install-recommends ffmpeg)
          fi
      - name: Permanent onboarding review access and isolation
        run: node scripts/check-onboarding-review.cjs
      - name: Creator upload, picker and access regressions
        run: npm run test:creator-upload
      - name: Normal signup runner safety and cleanup regressions
        run: |
          node scripts/check-moxy-post-submit-edit.cjs
          node --import tsx scripts/check-twin-intake.ts
          node deployment/creator-flow-live-check.test.cjs
          node deployment/creator-flow-upload-memory.test.cjs
          python3 -m py_compile deployment/creator-flow-live-check.py
      - name: Messages loading and creator switch feedback
        run: |
          node scripts/check-creator-switch-feedback.cjs
          node --import tsx scripts/check-messages-read-parallelism.cjs
          node --import tsx scripts/check-live-telegram.ts
      - name: Dashboard loading and day-long session regressions
        run: |
          node --import tsx scripts/check-agency-session.ts
          node --import tsx scripts/check-dashboard-performance.cjs
      - name: Owner authentication and existing master access
        run: |
          node --import tsx scripts/check-owner-auth.ts
          node scripts/check-agency-team.cjs
          node --import tsx scripts/check-onlyfans-connection-status.ts
      - name: Moxy owner scope and retained partner permissions
        run: |
          node --import tsx scripts/check-moxy-owner-access.ts
          node --import tsx scripts/check-sidebar-layout.tsx

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.inputs.ref || github.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Video preview encoder
        timeout-minutes: 7
        run: |
          if [ -f scripts/install-ci-video-tools.sh ]; then
            bash scripts/install-ci-video-tools.sh
          else
            command -v ffmpeg && command -v ffprobe || (sudo timeout --kill-after=10s 150s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=30 update && sudo timeout --kill-after=10s 210s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=30 install -y --no-install-recommends ffmpeg)
          fi
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      # Repo-local suites only. Database-backed rollup/tiles checks stay local;
      # the deployment runner intentionally receives no Supabase credentials.
      - name: Checks
        run: npm run test:offline

  # Final OnlyFans integration requires the complete candidate checks before
  # promotion. A cancelled, skipped or failed test job cannot release an image.
  build-and-deploy:
    needs: [creator-uploads, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.inputs.ref || github.sha }}" }

      # Using the scoped twin-deploy key. It can push to ECR and send an SSM
      # command and NOTHING else - explicit Deny on creating users or keys, on
      # billing, and on overwriting anything under /botfleet/prod/*. Verified
      # by real AccessDenied, not by reading the policy.
      # UPGRADE PATH: swap these two secrets for `role-to-assume:
      # arn:aws:iam::323149985112:role/twin-github-deploy` once the OIDC
      # provider exists, and no long-lived key sits in GitHub at all.
      - name: AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push, tagged with the commit
        id: build
        run: |
          set -euo pipefail
          SHA="${{ github.event.inputs.ref || github.sha }}"
          # GIT_SHA is baked in so the running container can be asked what it
          # is, rather than inferred from a tag or an image id.
          docker build --build-arg GIT_SHA="$SHA" -t "$ECR_REPO:$SHA" .
          docker push "$ECR_REPO:$SHA"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$ECR_REPO:$SHA")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"       >> "$GITHUB_OUTPUT"
          echo "will deploy $DIGEST"

      - name: Wait for creator uploads before restart
        run: python3 deployment/creator-upload-idle.py --brand=moxy

      - name: Tell the box to pull that digest and restart
        id: deploy
        run: |
          set -euo pipefail
          # Only unused images/build cache are reclaimed. Docker preserves the
          # image backing the currently running dashboard container.
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${{ steps.build.outputs.sha }}" \
            --parameters commands="[\"sudo docker image prune -af && sudo docker builder prune -af && sudo /usr/local/bin/twin-pull.sh '${{ steps.build.outputs.digest }}' '$CONTAINER' '$REMOTE_DIR' $EXTRA_RUN_ARGS\"]" \
            --query 'Command.CommandId' --output text)
          echo "command: $CMD_ID"
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '{status:Status,out:StandardOutputContent,err:StandardErrorContent}' --output text
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query 'Status' --output text)
          [ "$STATUS" = "Success" ] || { echo "DEPLOY FAILED: $STATUS"; exit 1; }

      # Verify the RUNNING CONTAINER, not the image id and not git log. Both
      # boxes have served stale code while every other signal said green.
      - name: Prove what is actually running
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters commands="[\"sudo docker inspect -f '{{.State.Running}} {{.Image}}' $CONTAINER; sudo docker exec $CONTAINER printenv GIT_SHA\"]" \
            --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          OUT=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text)
          echo "$OUT"
          echo "$OUT" | grep -q "${{ steps.build.outputs.sha }}" \
            || { echo "RUNNING CONTAINER IS NOT THE COMMIT WE SHIPPED"; exit 1; }
          echo "confirmed: container is running ${{ steps.build.outputs.sha }}"

      - name: Verify agency earnings and private photo delivery
        timeout-minutes: 4
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters commands="[\"sudo docker exec $CONTAINER node dashboard-recovery-check.cjs\"]" \
            --query 'Command.CommandId' --output text)
          STATUS=Pending
          for attempt in $(seq 1 40); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '{status:Status,out:StandardOutputContent,err:StandardErrorContent}' --output text
          [ "$STATUS" = "Success" ] || { echo "Dashboard recovery verification failed: $STATUS"; exit 1; }

      - name: Verify normal Moxy signup, optional flow and 75 MiB photo boundaries with exact cleanup
        timeout-minutes: 15
        run: python3 deployment/creator-flow-live-check.py --brand=moxy --expected-sha="${{ steps.build.outputs.sha }}" --mode=photo-boundaries --removal-guards

      # Public GETs only. A successful container swap is not proof of URL routing.
      - name: Verify catalogue video previews for all discovered creators
        timeout-minutes: 40
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters '{"commands":["sudo docker exec next-app node catalogue-preview-check.cjs"],"executionTimeout":["2160"]}' \
            --query 'Command.CommandId' --output text)
          STATUS=Pending
          for attempt in $(seq 1 400); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '{status:Status,out:StandardOutputContent,err:StandardErrorContent}' --output text
          [ "$STATUS" = "Success" ] || { echo "Catalogue preview verification failed: $STATUS"; exit 1; }

      # Public GETs only. A successful container swap is not proof of URL routing.
      - name: Verify public Ava homepage
        run: node scripts/check-ava-site.mjs --http-only
        env:
          AVA_CHECK_ORIGIN: https://dashboard.tgaiclone.xyz
