name: Unified Telegram live verification
on:
  push:
    branches: [codex/unified-live-telegram-20261013]
  workflow_run:
    workflows: [deploy-dashboard]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Verify source access or deployed unified conversations without sends
        run: python3 deployment/live-telegram-check.py
        env:
          VERIFY_UNIFIED: ${{ github.event_name == 'workflow_run' && '1' || '0' }}
          EXPECTED_DASHBOARD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
