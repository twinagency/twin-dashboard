name: Diagnose catalogue video sources
on:
  push:
    branches: [main]
    paths:
      - scripts/diagnose-catalogue-video-sources.cjs
      - .github/workflows/catalogue-video-diagnosis.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Read video container diagnostics
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,pathlib
          code=base64.b64encode(pathlib.Path('scripts/diagnose-catalogue-video-sources.cjs').read_bytes()).decode()
          command="printf '%s' '"+code+"' | base64 -d | sudo docker exec -i next-app node"
          pathlib.Path('/tmp/video-diagnosis-command.json').write_text(json.dumps({'commands':[command]}))
          PY
          CMD_ID=$(aws ssm send-command --instance-ids i-09a9dd3bd749643a5 --document-name AWS-RunShellScript --parameters file:///tmp/video-diagnosis-command.json --query Command.CommandId --output text)
          STATUS=Pending
          for attempt in $(seq 1 50); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09a9dd3bd749643a5 --query Status --output text)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09a9dd3bd749643a5 --query '{status:Status,out:StandardOutputContent,err:StandardErrorContent}' --output text
          [ "$STATUS" = Success ]
