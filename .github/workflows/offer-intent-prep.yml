name: Prepare reviewed Twin V2 offer-intent release
on:
  push:
    branches: [codex/v2-offer-intent-prep-20261014]
    paths:
      - deployment/prepare-offer-intent.py
      - deployment/offer-intent-workflow.py
      - deployment/offer-release-payload.b64
      - .github/workflows/offer-intent-prep.yml
permissions:
  contents: write
concurrency:
  group: twin-v2-production-operations
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Build and test the exact candidate without replacing production
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OFFER_PHASE: prepare
        run: python3 deployment/offer-intent-workflow.py
