name: Deploy sharp creator verification
on:
  workflow_dispatch:
    inputs:
      dashboard_commit:
        description: Exact verified running dashboard commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: deploy-dashboard
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_DASHBOARD_COMMIT: ${{ inputs.dashboard_commit }}
    steps:
      - uses: actions/checkout@v4
      # Pinned immutable image from successful verification build 39371054792.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Check the running dashboard and idle browser
        run: node deployment/creator-sign-in-polish-rollout.cjs preflight
      - name: Pull the tested browser image
        run: node deployment/creator-sign-in-polish-rollout.cjs pull
      - name: Update only the private browser
        id: browser
        run: node deployment/creator-sign-in-polish-rollout.cjs browser
      - name: Verify lossless provider frames through the private API
        id: probe
        run: node deployment/creator-sign-in-polish-rollout.cjs probe
      - name: Final service checks
        id: health
        run: node deployment/creator-sign-in-polish-rollout.cjs health
      - name: Restore the old browser if verification fails
        if: failure() && (steps.browser.outcome == 'failure' || steps.probe.outcome == 'failure' || steps.health.outcome == 'failure')
        run: node deployment/creator-sign-in-polish-rollout.cjs rollback
      - name: Retain command identifiers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-polish-commands
          path: /tmp/twin-verification-polish-1aee00e.json
