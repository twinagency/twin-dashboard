name: Read-only named clone reply diagnosis
on:
  push:
    branches: [ops/rcy07-clone-reply-check-20261013]
    paths: [deployment/rcy07-clone-reply-check.py, .github/workflows/rcy07-clone-reply-check.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate read-only diagnostic syntax
        run: python3 -m py_compile deployment/rcy07-clone-reply-check.py
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Read fleet state and personal reply evidence without sends or changes
        run: python3 -u deployment/rcy07-clone-reply-check.py
