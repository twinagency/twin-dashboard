name: CI

on:
  push:
    branches: ["**"]
    # Docs are not shipped and not read at runtime, so a docs-only push has
    # nothing to test. Matches the same filter in deploy.yml.
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - 'archive/**'
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # ── ADDED 2026-08-18 ────────────────────────────────────────────────
      # The dashboard has had eight behavioural suites since long before this
      # file existed and CI ran NONE of them - it ran tsc and next build and
      # called that a pass. Two of the eight (admin-api, public-api) need a
      # live server, so they stay local. These six need nothing but the repo.
      # check-revenue-rollups and check-spend sit on the money display path,
      # which is where two separate August bugs hid 91% and ~98% of revenue.
      - name: Behavioural checks
        run: npm run test:offline
