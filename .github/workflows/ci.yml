name: CI

on:
  push:
    branches: ["**"]
    # Docs are not shipped and not read at runtime, so a docs-only push has
    # nothing to test. Matches the same filter in deploy.yml.
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - 'archive/**'
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # These checks use isolated fixtures, never production database credentials.
      - name: Behavioural checks
        run: npm run test:offline

      - name: Production login routing smoke
        run: node scripts/check-login-pages.mjs
