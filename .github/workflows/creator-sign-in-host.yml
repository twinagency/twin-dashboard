name: Private sign-in host readiness
on:
  push:
    branches: [codex/creator-seamless-connect-20261020]
    paths: ['.github/workflows/creator-sign-in-host.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Existing scoped deployment credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Read resource, container and sandbox readiness only
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command --instance-ids i-09a9dd3bd749643a5 --document-name AWS-RunShellScript --comment 'Read-only private sign-in host readiness' --parameters '{"commands":["free -m","df -h /","sudo docker ps --format \"{{.Names}} {{.Status}}\"","sudo docker stats --no-stream --format \"{{.Name}} {{.MemUsage}}\"","sudo docker network inspect twin-onlyfans_default --format \"{{range .Containers}}{{.Name}} {{end}}\"","sysctl kernel.unprivileged_userns_clone user.max_user_namespaces kernel.apparmor_restrict_unprivileged_userns || true","sudo docker info --format \"{{json .SecurityOptions}}\""]}' --query Command.CommandId --output text)
          for attempt in $(seq 1 35); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id i-09a9dd3bd749643a5 --query Status --output text 2>/dev/null || true)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 3
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id i-09a9dd3bd749643a5 --query '{status:Status,out:StandardOutputContent,err:StandardErrorContent}' --output json
          test "$STATUS" = Success
