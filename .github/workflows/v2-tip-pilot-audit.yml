name: Audit live Twin V2 tip pilot

on:
  push:
    branches: [codex/v2-tip-pilot-audit-20261014]
    paths-ignore:
      - docs/tip-pilot-audit-20261014.json

permissions:
  contents: write

concurrency:
  group: twin-v2-production-operations
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Read saved and applied tip state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 deployment/v2-tip-pilot-audit.py
