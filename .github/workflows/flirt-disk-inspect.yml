name: FLIRT deployment disk inspection
on:
  push:
    branches: ["codex/flirt-disk-inspect"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Reclaim unreferenced dashboard images while preserving all containers
        run: |
          python3 - <<'PY'
          import json, subprocess, time
          def aws(args):
              return json.loads(subprocess.check_output(["aws", "--region", "ap-southeast-2", *args, "--output", "json"]))
          assert aws(["sts","get-caller-identity"])["Account"] == "323149985112"
          request={"InstanceIds":["i-09a9dd3bd749643a5"],"DocumentName":"AWS-RunShellScript","Parameters":{"commands":["sudo python3 -c 'import json, shutil, subprocess\ndef run(args):\n    return subprocess.check_output(args, text=True).strip()\nbefore=shutil.disk_usage(\"/\").free\ncontainers=run([\"docker\",\"ps\",\"-aq\"]).split()\nused=set(run([\"docker\",\"inspect\",\"--format\",\"{{.Image}}\",*containers]).split()) if containers else set()\nimages=set(run([\"docker\",\"image\",\"ls\",\"-q\",\"--no-trunc\"]).split())\nremoved=[]\nfor image in images-used:\n    if shutil.disk_usage(\"/\").free >= 6*1024**3: break\n    digests=json.loads(run([\"docker\",\"image\",\"inspect\",\"--format\",\"{{json .RepoDigests}}\",image])) or []\n    if not digests or not all(d.startswith(\"323149985112.dkr.ecr.ap-southeast-2.amazonaws.com/twin-dashboard@sha256:\") for d in digests): continue\n    # No force: Docker itself rejects any image now used by a container.\n    result=subprocess.run([\"docker\",\"image\",\"rm\",image],capture_output=True,text=True)\n    if result.returncode==0: removed.append(image)\nafter=shutil.disk_usage(\"/\").free\nprint(json.dumps({\"before_free_bytes\":before,\"after_free_bytes\":after,\"unreferenced_dashboard_images_removed\":removed,\"containers_removed\":0,\"volumes_removed\":0}))\n'"],"executionTimeout":["120"]}}
          command=aws(["ssm","send-command","--cli-input-json",json.dumps(request)])["Command"]["CommandId"]
          for attempt in range(40):
              time.sleep(3)
              try: state=aws(["ssm","get-command-invocation","--command-id",command,"--instance-id","i-09a9dd3bd749643a5"])
              except subprocess.CalledProcessError: continue
              if state["Status"] in ("Pending","InProgress","Delayed"):continue
              print(state.get("StandardOutputContent",""));print(state.get("StandardErrorContent",""))
              assert state["Status"]=="Success",state["Status"]
              break
          else:raise RuntimeError("Read-only disk inspection timed out")
          PY
