name: Clear superseded navigation verification
on:
  push:
    branches: ["codex/navigation-ci-cleanup-20261022"]
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Stop duplicate application CI for this deployment-helper branch only
        uses: actions/github-script@v7
        with:
          script: |
            const branch = "codex/messages-load-speed-20261022";
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {...context.repo, branch, per_page: 100});
            for (const run of runs) {
              if (run.head_branch !== branch || run.name !== "CI" || run.status === "completed") continue;
              try {
                await github.rest.actions.cancelWorkflowRun({...context.repo, run_id: run.id});
                core.info("Stopped duplicate helper-branch application check " + run.id);
              } catch (error) { if (![409,422].includes(error.status)) throw error; }
            }
