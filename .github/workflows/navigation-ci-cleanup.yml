name: Clear superseded navigation verification
on:
  push:
    branches: ["codex/navigation-ci-cleanup-20261022"]
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Stop only superseded copies of this task's checks
        uses: actions/github-script@v7
        with:
          script: |
            const superseded = new Set([
              "9cd30998a674ff80b0cf216a5828364e972a0cfa",
              "54615bf811fdcd17d965a75575c975c454a2140d",
              "7d18790943ef96073f6a4a9dd09a781d05d31689",
              "acd9a570559affc9deeade046b2aa06988c4d2de",
              "39255cbbe1a09e807990a11080933ad408ce6996",
              "ca1618c79c097fbe645826324dbaa8ee992cdd2d",
              "50f442281ecac0c958c1f402dfffe1c1505deba2",
              "a3c31f86c51c321858fb22abff4cf98a82a2e01e",
              "7e52370ea2599508f0fe98c3ca9cce45db5fa284"
            ]);
            for (const head_sha of superseded) {
              const {data} = await github.rest.actions.listWorkflowRunsForRepo({...context.repo, head_sha, per_page: 100});
              for (const run of data.workflow_runs) {
                if (!superseded.has(run.head_sha) || run.status === "completed") continue;
                try {
                  await github.rest.actions.cancelWorkflowRun({...context.repo, run_id: run.id});
                  core.info("Stopped superseded check " + run.id);
                } catch (error) {
                  if (![409,422].includes(error.status)) throw error;
                  core.info("Check already finishing " + run.id);
                }
              }
            }
