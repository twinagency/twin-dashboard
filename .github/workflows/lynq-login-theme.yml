name: LYNQ login visual checks
on:
  push:
    branches: [main, fix/lynq-login-brand-20260910]
    paths:
      - app/link/page.tsx
      - app/lynq/**
      - components/TwinWordmark.tsx
      - scripts/check-lynq-login-theme.mjs
      - .github/workflows/lynq-login-theme.yml
  workflow_run:
    workflows: [deploy-dashboard]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: lynq-login-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx playwright install chromium
      - name: Check real login components, colours and form behaviour
        run: node scripts/check-lynq-login-theme.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lynq-login-preview
          path: test-results/lynq-login
          retention-days: 3
          if-no-files-found: ignore
  live:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npx playwright install chromium
      - name: Read-only browser verification of deployed login pages
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {mkdirSync,writeFileSync} from 'node:fs';
          import {chromium} from 'playwright';
          mkdirSync('test-results/lynq-login-live',{recursive:true});
          const browser=await chromium.launch();
          const results=[];
          try {
            for(const route of ['/link','/lynq']) {
              for(const width of [390,1440]) {
                const page=await browser.newPage({viewport:{width,height:900},colorScheme:'dark'});
                await page.route('**/*',r=>r.request().method()==='GET'?r.continue():r.abort());
                const response=await page.goto('https://dashboard.tgaiclone.xyz'+route,{waitUntil:'networkidle'});
                assert.equal(response.status(),200);
                await page.locator('[data-lynq-login="light"]').waitFor();
                const state=await page.evaluate(()=>({
                  background:getComputedStyle(document.querySelector('[data-lynq-login]')).backgroundColor,
                  card:getComputedStyle(document.querySelector('[data-login-card]')).backgroundColor,
                  gradient:getComputedStyle(document.querySelector('[data-login-wash]')).backgroundImage,
                  action:document.querySelector('form').getAttribute('action'),
                  core:document.querySelectorAll('[data-lynq-core] canvas').length,
                  overflow:document.documentElement.scrollWidth>innerWidth,
                }));
                assert.equal(state.background,'rgb(250, 249, 252)');
                assert.equal(state.card,'rgb(255, 255, 255)');
                assert.match(state.gradient,/255, 139, 53/);assert.match(state.gradient,/233, 75, 156/);assert.match(state.gradient,/63, 85, 255/);
                assert.equal(state.action,route+'/auth');assert.equal(state.core,1);assert.equal(state.overflow,false);
                await page.screenshot({path:`test-results/lynq-login-live/${route.slice(1)}-${width}.png`,fullPage:true});
                results.push({route,width,...state});await page.close();
              }
            }
            writeFileSync('test-results/lynq-login-live/results.json',JSON.stringify(results,null,2));
            console.log('LIVE VERIFIED: both LYNQ login URLs use the matching light orange/pink/blue design, white sign-in card and original particle logo. No credentials submitted.');
          } finally {await browser.close();}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lynq-login-live
          path: test-results/lynq-login-live
          retention-days: 3
          if-no-files-found: ignore
