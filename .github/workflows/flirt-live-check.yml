name: FLIRT live onboarding verification
on:
  push:
    branches: ["flirt/independent-backend-2026-09-19"]
    paths:
      - .github/workflows/flirt-live-check.yml
      - deployment/flirt-live-check.py
      - deployment/flirt-live-check.cjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flirt-live-verification
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/flirt/independent-backend-2026-09-19'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Existing authorised AWS connection
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Synthetic FLIRT creator journeys and private storage
        run: python3 deployment/flirt-live-check.py
      - name: Read public DNS records
        if: always()
        run: |
          dig +short NS lynqai.co
          dig +short A dashboard.lynqai.co
