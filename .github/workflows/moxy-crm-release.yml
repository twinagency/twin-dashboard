name: Moxy CRM candidate
on:
  push:
    branches: [codex/moxy-onlyfans-crm-20261025]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: node --import tsx scripts/check-onlyfans-agency.ts
      - run: node scripts/check-onlyfans-creator-connect.cjs
      - run: node --import tsx scripts/check-moxy-owner-access.ts
      - run: npx tsc --noEmit
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build immutable dashboard candidate
        run: |
          set -euo pipefail
          IMAGE=323149985112.dkr.ecr.ap-southeast-2.amazonaws.com/twin-dashboard:moxy-$GITHUB_SHA
          docker build --build-arg GIT_SHA="$GITHUB_SHA" --label org.opencontainers.image.revision="$GITHUB_SHA" -t "$IMAGE" .
          docker push "$IMAGE"
          docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE"
