name: Scoped rcy07 conversation maintenance
on:
  push:
    branches: [ops/rcy07-fresh-chat-20261013]
    paths:
      - deployment/rcy07-reset-host.py
      - deployment/rcy07-reset-runner.py
      - .github/workflows/rcy07-reset.yml
permissions:
  contents: read
concurrency:
  group: rcy07-conversation-maintenance
  cancel-in-progress: false
jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check maintenance script syntax
        run: python3 -m py_compile deployment/rcy07-reset-host.py deployment/rcy07-reset-runner.py
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Run account-scoped maintenance
        run: python3 -u deployment/rcy07-reset-runner.py
