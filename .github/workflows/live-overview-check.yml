name: Live Dashboard overview verification
on:
  workflow_run:
    workflows: [deploy-dashboard]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Verify overview, earnings redirect and live reporting scope
        run: python3 deployment/live-overview-check.py
        env:
          EXPECTED_DASHBOARD_SHA: ${{ github.event.workflow_run.head_sha }}
