name: Validate isolated exact-photo reference candidate
on:
  push:
    branches: [codex/media-launch-access-20261012]
permissions:
  contents: read
concurrency:
  group: v2-photo-incident-isolated-validation
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Read-only ownership and isolated real-model replay
        run: python3 deployment/photo-launch-access.py
