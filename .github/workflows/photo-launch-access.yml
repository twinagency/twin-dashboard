name: Check bounded V2 selection contract without sends
on:
  push:
    branches: [codex/media-launch-access-20261012]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Run four real-model probes over fake Telegram and isolated data
        run: python3 deployment/photo-launch-access.py
