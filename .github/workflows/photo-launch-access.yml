name: Validate isolated Twin V2 card candidate
on:
  push:
    branches: [codex/v2-card-model-validation-20261013]
    paths-ignore:
      - docs/existing-card-candidate-results.json
permissions:
  contents: write
concurrency:
  group: v2-photo-incident-isolated-validation
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Replay frozen V2 fleet with candidate source and record evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 deployment/photo-launch-access.py
