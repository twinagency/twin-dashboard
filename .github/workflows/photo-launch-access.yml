name: Review controlled creator photo
on:
  push:
    branches: [codex/photo-source-review-20261012]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Read creator-owned photo securely
        run: python3 deployment/photo-launch-access.py

      - uses: actions/upload-artifact@v4
        with:
          name: controlled-photo-source
          path: photo-source
          retention-days: 1
