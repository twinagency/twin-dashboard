name: Prepare isolated Twin V2 price guard release
on:
  push:
    branches: [codex/v2-price-guard-release-prep-20261014]
    paths-ignore:
      - docs/price-guard-release-prepared-20261014.json
permissions:
  contents: write
concurrency:
  group: v2-photo-incident-isolated-validation
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Build pinned full remote source, verify packaged gates, prepare rollback
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 deployment/photo-launch-access.py
