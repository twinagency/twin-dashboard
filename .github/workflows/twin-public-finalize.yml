name: Final public-site layout verification
on:
  push:
    branches: [feat/twinagency-public-site]
    paths: [.github/workflows/twin-public-finalize.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/twinagency-public-site
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact reviewed mobile correction
        run: |
          python3 - <<'PY'
          import pathlib,subprocess
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()=='829c6b75e019c1c020656f38aeacb078ad756362'
          css=pathlib.Path('app/twin-agency/site.module.css')
          test=pathlib.Path('scripts/check-marketing-site.mjs')
          assert subprocess.check_output(['git','hash-object',str(css)],text=True).strip()=='f1ad0379976856151f39a8df469e77c4168c33be'
          assert subprocess.check_output(['git','hash-object',str(test)],text=True).strip()=='d56a17a1aef932969d6b8300c595a5ccb442713f'
          css.write_text(css.read_text()+'''\n/* Keep intrinsic demo controls from widening a 320px mobile grid column. */
          @media(max-width:380px){.product,.featureGrid,.steps,.controlSection,.faqSection{grid-template-columns:minmax(0,1fr)}.productCopy,.demoStage,.featureCard,.controlCard,.faqList{min-width:0}.demoStage{padding:16px 12px 13px}.demoTabs{width:100%;gap:0}.demoTabs button{padding:9px 6px;font-size:8px;gap:2px;min-width:0;flex:1}.demoTabs button svg{display:none}.productCopy h2{font-size:49px}.phoneHeader{padding:14px 12px}.phoneHeader small{font-size:8px}.chatArea{padding:15px 12px}.visualMedia>div{width:80px}.mockSidebar button{padding:8px 6px;font-size:8px;gap:4px}.mockStats{grid-template-columns:repeat(3,minmax(0,1fr))}.mockStats strong{overflow-wrap:anywhere}}
          ''')
          source=test.read_text()
          needle="    const assertChatFits = async () => {"
          assert source.count(needle)==1
          guard='''    const cardsFit = await page.locator('#product > div, [class*="featureCard"], [class*="dashboardMock"], [class*="controlCard"]').evaluateAll(elements => elements.every(el => { const r=el.getBoundingClientRect(); return r.left>=-1 && r.right<=window.innerWidth+1; }));
              assert.ok(cardsFit, `Primary cards must remain inside the ${width}px viewport even when page overflow is clipped`);
          '''
          test.write_text(source.replace(needle,guard+needle))
          pathlib.Path('.github/workflows/twin-public-finalize.yml').unlink()
          PY
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm run test:offline
      - run: node scripts/check-login-pages.mjs
      - run: npx tsx scripts/check-marketing-access.ts
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-marketing-site.mjs
      - name: Save only tested frontend corrections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/twin-agency/site.module.css scripts/check-marketing-site.mjs .github/workflows/twin-public-finalize.yml
          git commit -m 'fix: keep public product preview fully inside compact mobile screens'
          git push origin HEAD:feat/twinagency-public-site
          git rev-parse HEAD > test-results/twin-public/verified-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twin-public-final-reviewed
          path: test-results/twin-public
          if-no-files-found: ignore
          retention-days: 3
