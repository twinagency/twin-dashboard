name: Payout live verification
on:
  push:
    branches: [codex/payout-live-verification-20261023]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - brand: flirt
            container: flirt-dashboard
            sha: 654d42461940d68412d929d42680fcc7b3d6fc32
          - brand: twin-moxy
            container: next-app
            sha: f61aaea609a2cb391c066fb48c98ca2584d17e9e
    name: Verify ${{ matrix.brand }} payout permissions
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Verify existing admin and creator views without recording payments
        run: python3 deployment/payout-live-verification.py
        env:
          PAYOUT_CONTAINER: ${{ matrix.container }}
          PAYOUT_EXPECTED_SHA: ${{ matrix.sha }}
