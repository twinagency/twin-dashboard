name: FLIRT agency Overview review
on:
  push:
    branches: ["codex/flirt-agency-overview-20261011"]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Read the existing selected agency portraits
        run: python3 deployment/flirt-agency-review.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx playwright install --with-deps chromium
      - name: Verify Overview interactions, data scoping and responsive layout
        run: node deployment/flirt-agency-ui-check.cjs
      - name: Build the production source
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flirt-agency-overview-review
          path: /tmp/flirt-agency-review
          retention-days: 1
