name: Read-only creator upload feedback diagnostics
on:
  push:
    branches: ["fix/creator-upload-feedback-2026-10-04"]
    paths: [".github/workflows/creator-upload-feedback.yml", "deployment/creator-upload-feedback.py"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Read serving versions and safe upload timings
        run: python3 deployment/creator-upload-feedback.py
