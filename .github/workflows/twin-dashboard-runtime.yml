name: Agency CRM immutable image build
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact dashboard commit to package
        required: true
        type: string
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate immutable source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify checkout
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and publish candidate without deploying
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          IMAGE=323149985112.dkr.ecr.ap-southeast-2.amazonaws.com/twin-dashboard:agency-crm-$SOURCE_SHA
          docker build --build-arg GIT_SHA="$SOURCE_SHA" --label org.opencontainers.image.revision="$SOURCE_SHA" -t "$IMAGE" .
          docker push "$IMAGE"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")
          jq -n --arg source "$SOURCE_SHA" --arg digest "$DIGEST" '{source:$source,digest:$digest,deployed:false}' > agency-crm-image.json
          cat agency-crm-image.json
      - uses: actions/upload-artifact@v4
        with:
          name: agency-crm-image
          path: agency-crm-image.json
          if-no-files-found: error
