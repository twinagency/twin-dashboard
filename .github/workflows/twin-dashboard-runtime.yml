name: Agency CRM immutable image build
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact dashboard source
        required: true
        type: string
permissions: {contents: read}
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Build exact Dockerfile without deployment credentials
        env: {SOURCE_SHA: "${{ inputs.source_sha }}"}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          docker build --build-arg GIT_SHA="$SOURCE_SHA" --label org.opencontainers.image.revision="$SOURCE_SHA" -t twin-dashboard:agency-crm-$SOURCE_SHA .
          docker image inspect twin-dashboard:agency-crm-$SOURCE_SHA --format '{{.Id}}' > image-id.txt
          docker save twin-dashboard:agency-crm-$SOURCE_SHA | gzip -1 > dashboard-image.tar.gz
          sha256sum dashboard-image.tar.gz > image-sha256.txt
          printf '%s\n' "$SOURCE_SHA" > source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: agency-crm-immutable-image
          compression-level: 0
          path: |
            dashboard-image.tar.gz
            image-id.txt
            image-sha256.txt
            source-sha.txt
          if-no-files-found: error
