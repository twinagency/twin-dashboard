name: Jess Kate source review
on:
  push:
    branches: [feat/jess-kate-portal]
    paths: [.github/workflows/jess-kate-review.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=tar.gz HEAD > /tmp/jess-kate-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: jess-kate-source
          path: /tmp/jess-kate-source.tar.gz
          retention-days: 1
