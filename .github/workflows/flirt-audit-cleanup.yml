name: FLIRT identified audit cleanup verification
on:
  push:
    branches: ["fix/flirt-audit-cleanup-2026-10-04"]
    paths:
      - .github/workflows/flirt-audit-cleanup.yml
permissions:
  contents: read
concurrency:
  group: flirt-identified-audit-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.ref == 'refs/heads/fix/flirt-audit-cleanup-2026-10-04'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FLIRT_EXPECTED_COMMIT: cf19af8c250d766b8a5d33a63aa2c6d91aba4be1
    steps:
      - uses: actions/checkout@v4
      - name: Check exact-scope cleanup syntax
        run: node --check deployment/flirt-audit-cleanup.cjs
      - name: Existing authorized AWS connection
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Remove the identified synthetic audit media and account through Storage and Auth APIs
        run: python3 deployment/flirt-audit-cleanup.py
