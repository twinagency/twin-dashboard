name: flirt-dashboard
services:
  dashboard:
    build: .
    image: flirt-dashboard:local
    container_name: flirt-dashboard
    ports:
      # Twin keeps its existing port 3001. Only the local reverse proxy can
      # reach FLIRT on 3101. Configure FLIRT's hostname in that proxy.
      - "127.0.0.1:3101:3001"
    env_file:
      - .env
    restart: unless-stopped
    stop_grace_period: 30s
