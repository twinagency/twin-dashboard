# Include inside the FLIRT TLS VirtualHost before its catch-all ProxyPass.
ProxyPassMatch "^/creator/telegram$" "http://127.0.0.1:3114/creator/telegram"
ProxyPassMatch "^/creator-auth/telegram/feed$" "http://127.0.0.1:3114/creator-auth/telegram/feed"
ProxyPassMatch "^/flirt-telegram/launcher\.js$" "!"
Alias "/flirt-telegram/launcher.js" "/var/www/flirt-creator-telegram/launcher.js"
<Directory "/var/www/flirt-creator-telegram">
    AllowOverride None
    Options None
    Require all granted
</Directory>
<LocationMatch "^/flirt-telegram/launcher\.js$">
    Header set Cache-Control "no-cache"
    Header set X-Content-Type-Options "nosniff"
</LocationMatch>
<LocationMatch "^/creator/?$">
    RequestHeader unset Accept-Encoding
    AddOutputFilterByType SUBSTITUTE text/html
    SubstituteMaxLineLength 16m
    Substitute "s|</body>|<script defer src='/flirt-telegram/launcher.js'></script></body>|in"
</LocationMatch>
